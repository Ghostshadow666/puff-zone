<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUFF ZONE - Explorez la nouvelle dimension</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <img src="puff.png" class="floating-puff left" alt="Puff" onerror="this.style.display='none'">
    <img src="puff.png" class="floating-puff right" alt="Puff" onerror="this.style.display='none'">

    <header class="header">
        <div class="logo">PUFF <span>ZONE</span></div>
        <div class="header-actions">
            <a href="/livreur.html" class="btn-header">Livreur</a>
            <a href="/admin.html" class="btn-header">Admin</a>
            <div id="user-greeting" style="font-weight: 600; color: var(--white); font-size: 0.85rem;">&#128075; Visiteur</div>
            <button id="cart-btn" class="btn-panier" onclick="toggleCart()">Panier (<span id="cart-count">0</span>)</button>
        </div>
    </header>

    <main id="main-site" class="layout-principal" style="display: none;">
        <aside class="sidebar-categories" id="categories-container"></aside>
        <section class="contenu-catalogue">
            <h1>Le Catalogue</h1>
            <div class="grille-produits" id="product-list"></div>
        </section>
    </main>

    <!-- MODALE DE CONNEXION -->
    <div id="login-modal" style="display:flex; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; align-items:center; justify-content:center; backdrop-filter: blur(10px);">
        <div class="modal-content" style="background:var(--card); padding:40px; border-radius:8px; border:1px solid var(--border); width:90%; max-width:400px; text-align:center; box-shadow: 0 0 50px rgba(0,240,255,0.1);">
            <h2 style="color:var(--white); margin-top:0; font-family:'Orbitron', sans-serif; letter-spacing: 3px;">PUFF ZONE</h2>
            <div id="step-choice">
                <p style="color:var(--text2); font-size:12px; text-transform: uppercase; margin-bottom: 25px; letter-spacing:2px;">Initialisation</p>
                <button onclick="showLoginForm()" class="btn-panier" style="width:100%; margin-bottom: 15px; padding: 14px;">Se Connecter</button>
                <button onclick="showRegisterForm()" class="btn-header" style="width:100%; border-color:var(--border); margin-bottom: 25px; padding: 14px;">Cr&eacute;er un compte</button>
                <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; margin-top: 10px;">
                    <a href="/admin-login.html" style="color: var(--text2); text-decoration: none; font-size: 11px; text-transform: uppercase; font-weight: bold; letter-spacing:1px;">Acc&egrave;s Staff</a>
                </div>
            </div>
            <!-- Étapes de connexion et inscription (gardées identiques pour la stabilité) -->
            <div id="step-phone" style="display: none;">
                <input type="text" id="phone-input" placeholder="Num&eacute;ro de t&eacute;l&eacute;phone" style="width:100%; padding:14px; background:rgba(0,0,0,0.5); border:1px solid var(--border); color:white; border-radius:4px; margin-bottom:20px; box-sizing:border-box; outline:none;">
                <button onclick="checkPhone()" class="btn-panier" style="width:100%; margin-bottom: 15px; padding: 14px;">Continuer</button>
                <button onclick="backToChoice()" style="background:none; border:none; color:var(--text2); cursor:pointer; font-size:12px;">&larr; Retour</button>
            </div>
            <div id="step-info" style="display:none;">
                <input type="text" id="name-input" placeholder="Pr&eacute;nom/Nom" style="width:100%; padding:14px; background:rgba(0,0,0,0.5); border:1px solid var(--border); color:white; border-radius:4px; margin-bottom:15px; box-sizing:border-box; outline:none;">
                <input type="text" id="phone-input-reg" placeholder="T&eacute;l&eacute;phone" style="width:100%; padding:14px; background:rgba(0,0,0,0.5); border:1px solid var(--border); color:white; border-radius:4px; margin-bottom:15px; box-sizing:border-box; outline:none;">
                <input type="text" id="address-input" placeholder="Adresse" style="width:100%; padding:14px; background:rgba(0,0,0,0.5); border:1px solid var(--border); color:white; border-radius:4px; margin-bottom:15px; box-sizing:border-box; outline:none;">
                <input type="text" id="whatsapp-input" placeholder="WhatsApp (Optionnel)" style="width:100%; padding:14px; background:rgba(0,0,0,0.5); border:1px solid var(--border); color:white; border-radius:4px; margin-bottom:20px; box-sizing:border-box; outline:none;">
                <button onclick="saveProfile()" class="btn-panier" style="width:100%; margin-bottom: 15px; padding: 14px;">S'inscrire</button>
                <button onclick="backToChoice()" style="background:none; border:none; color:var(--text2); cursor:pointer; font-size:12px;">&larr; Retour</button>
            </div>
        </div>
    </div>

    <!-- PANIER -->
    <div id="cart-drawer">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:20px;">
            <h2 style="margin:0; color:white; font-family:'Orbitron', sans-serif; font-size: 1.2rem; letter-spacing:2px;">PANIER</h2>
            <button onclick="toggleCart()" style="background:none; border:none; color:var(--text2); font-size:24px; cursor:pointer;">&times;</button>
        </div>
        <div id="cart-items" style="flex-grow:1; overflow-y:auto; margin-top:25px;"></div>
        <div style="border-top:1px solid rgba(255,255,255,0.1); padding-top:20px;">
            <div id="promo-section" style="margin-bottom: 20px;">
                <div style="display:flex; gap:10px;">
                    <input type="text" id="promo-input" placeholder="CODE PROMO" style="flex:1; padding:12px; background:rgba(0,0,0,0.5); border:1px solid var(--border); color:white; border-radius:4px; outline:none; text-transform:uppercase; font-family:'Orbitron',sans-serif; font-size:0.8rem;">
                    <button onclick="applyPromo()" style="padding:12px 20px; background:var(--neon-cyan); color:black; border:none; border-radius:4px; font-weight:900; cursor:pointer; text-transform:uppercase;">OK</button>
                </div>
                <div id="promo-msg" style="font-size:12px; margin-top:8px; font-weight:bold;"></div>
            </div>
            <div style="margin-bottom: 20px;">
                <select id="zone-select" onchange="applyZone()" style="width:100%; padding:12px; background:rgba(0,0,0,0.5); border:1px solid var(--border); color:white; border-radius:4px; outline:none; font-weight:bold; font-size:0.85rem;">
                    <option value="">-- Choisir votre zone --</option>
                </select>
                <div id="zone-msg" style="font-size:12px; margin-top:8px; font-weight:bold;"></div>
            </div>
            <div style="display:flex; justify-content:space-between; margin-bottom:20px; font-weight:bold; align-items:center;">
                <span style="color:var(--text2); font-size:0.9rem; text-transform:uppercase; letter-spacing:1px;">Total :</span>
                <span id="cart-total-price" style="color:var(--neon-cyan); font-size:24px; font-family:'Orbitron', sans-serif; text-shadow:0 0 10px rgba(0,240,255,0.4);">0 &euro;</span>
            </div>
            <button id="checkout-btn" onclick="checkout()" class="btn-panier" style="width:100%; padding:16px; font-size:1rem; border-width:2px;">Valider la commande</button>
            <button onclick="logout()" style="width:100%; background:none; border:none; color:var(--red); margin-top:20px; cursor:pointer; font-size:11px; text-transform:uppercase; letter-spacing:2px; opacity:0.7;">Se d&eacute;connecter</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        window.appliedPromoCode = null; window.appliedPromoPct = 0;
        async function applyPromo() {
            const code = document.getElementById('promo-input').value.trim();
            const msg = document.getElementById('promo-msg');
            if (!code) { msg.textContent = "Veuillez entrer un code."; msg.style.color = "#ef4444"; return; }
            msg.textContent = "V&eacute;rification..."; msg.style.color = "#aaa";
            try {
                const res = await fetch('/api/promo/check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: code }) });
                const data = await res.json();
                if (data.success) {
                    window.appliedPromoCode = code; window.appliedPromoPct = data.pourcentage;
                    msg.innerHTML = `&#9989; Code appliqu&eacute; : -${data.pourcentage}%`; msg.style.color = "#10b981";
                    if (typeof updateCartUI === "function") updateCartUI();
                } else {
                    window.appliedPromoCode = null; window.appliedPromoPct = 0;
                    msg.innerHTML = `&#10060; ${data.error || 'Code invalide'}`; msg.style.color = "#ef4444";
                    if (typeof updateCartUI === "function") updateCartUI();
                }
            } catch (e) { msg.textContent = "Erreur"; msg.style.color = "#ef4444"; }
        }

        // --- PLANETE 3D SCI-FI HUD ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 9);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Lumières
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0x00f0ff, 1.5);
        dirLight.position.set(5, 3, 5);
        scene.add(dirLight);

        // Chargement des textures de la Terre (depuis CDN public)
        const textureLoader = new THREE.TextureLoader();
        const earthMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-night.jpg');
        const earthBump = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-topology.png');
        const earthSpec = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-water.png');

        // La Planète
        const planetGeo = new THREE.SphereGeometry(2.5, 64, 64);
        const planetMat = new THREE.MeshPhongMaterial({
            map: earthMap,
            bumpMap: earthBump,
            bumpScale: 0.05,
            specularMap: earthSpec,
            specular: new THREE.Color('grey'),
            emissive: new THREE.Color(0x002233), // Légère lueur bleue
            emissiveIntensity: 0.5
        });
        const planet = new THREE.Mesh(planetGeo, planetMat);
        planet.position.set(2.5, 0, 0); // Décalé à droite pour laisser la place au catalogue
        scene.add(planet);

        // Atmosphère (Halo Cyan lumineux)
        const atmosphereMat = new THREE.ShaderMaterial({
            vertexShader: `varying vec3 vNormal; void main() { vNormal = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
            fragmentShader: `varying vec3 vNormal; void main() { float intensity = pow(0.65 - dot(vNormal, vec3(0, 0, 1.0)), 2.5); gl_FragColor = vec4(0.0, 0.94, 1.0, 1.0) * intensity * 1.5; }`,
            blending: THREE.AdditiveBlending, side: THREE.BackSide, transparent: true
        });
        const atmosphere = new THREE.Mesh(new THREE.SphereGeometry(2.55, 64, 64), atmosphereMat);
        planet.add(atmosphere);

        // --- CREATION DES ANNEAUX HUD ---
        function createHudRing(radius, thickness, yOffset, tilt, speed, text) {
            const group = new THREE.Group();
            group.rotation.x = Math.PI / 2;
            group.rotation.y = tilt;
            group.position.y = yOffset;

            // Ligne de base de l'anneau
            const ringGeo = new THREE.RingGeometry(radius, radius + thickness, 128);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide, transparent: true, opacity: 0.15, blending: THREE.AdditiveBlending });
            const ringMesh = new THREE.Mesh(ringGeo, ringMat);
            group.add(ringMesh);

            // Texte sur l'anneau
            if (text) {
                const canvas = document.createElement('canvas');
                canvas.width = 4096; canvas.height = 128;
                const ctx = canvas.getContext('2d');
                
                // Fond transparent
                ctx.clearRect(0, 0, 4096, 128);
                
                // Texte Principal
                ctx.font = '900 80px "Orbitron", sans-serif';
                ctx.fillStyle = '#00f0ff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = '#00f0ff';
                ctx.shadowBlur = 15;
                
                // On écrit le texte normalement (pas de scale -1, il sera lu à l'endroit depuis l'extérieur)
                for (let i = 0; i < 4; i++) {
                    ctx.fillText(text, 512 + (i * 1024), 64);
                }
                
                // Petits textes HUD décoratifs (chiffres)
                ctx.font = '20px monospace';
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 5;
                for(let i=0; i<20; i++) {
                    const x = Math.random() * 4096;
                    ctx.fillText(Math.random() > 0.5 ? "0101" : "SYSTEM", x, Math.random() * 128);
                }

                const textTexture = new THREE.CanvasTexture(canvas);
                const textGeo = new THREE.CylinderGeometry(radius + thickness/2, radius + thickness/2, 0.4, 128, 1, true);
                const textMat = new THREE.MeshBasicMaterial({ map: textTexture, transparent: true, side: THREE.DoubleSide, depthWrite: false });
                const textMesh = new THREE.Mesh(textGeo, textMat);
                // On le place au bon endroit
                textMesh.rotation.x = Math.PI / 2; 
                group.add(textMesh);
            }

            // On stocke la vitesse de rotation dans l'objet
            group.userData = { speed: speed };
            return group;
        }

        // Anneau 1 (Interne)
        const ring1 = createHudRing(3.2, 0.2, 0, 0.2, 0.05, "PUFF ZONE");
        planet.add(ring1);

        // Anneau 2 (Externe)
        const ring2 = createHudRing(3.8, 0.1, 0, -0.4, -0.03, "PUFF ZONE");
        planet.add(ring2);

        // Particules d'étoiles
        const pCount = 2000; const pGeo = new THREE.BufferGeometry(); const pPos = new Float32Array(pCount * 3);
        for (let i = 0; i < pCount; i++) { 
            pPos[i * 3] = (Math.random() - 0.5) * 40; 
            pPos[i * 3 + 1] = (Math.random() - 0.5) * 40; 
            pPos[i * 3 + 2] = (Math.random() - 0.5) * 40; 
        }
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const starfield = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: 0.08, color: 0xffffff, transparent: true, opacity: 0.8 }));
        scene.add(starfield);

        // Parallaxe souris
        let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;
        document.addEventListener('mousemove', (e) => { mouseX = (e.clientX - window.innerWidth/2) * 0.0003; mouseY = (e.clientY - window.innerHeight/2) * 0.0003; });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            
            // Rotation de la planète
            planet.rotation.y = time * 0.02;
            
            // Rotation des anneaux
            ring1.rotation.z = time * ring1.userData.speed;
            ring2.rotation.z = time * ring2.userData.speed;

            starfield.rotation.y = time * 0.01;

            // Effet de parallaxe
            targetX += (mouseX - targetX) * 0.05; targetY += (mouseY - targetY) * 0.05;
            camera.position.x = targetX * 4; camera.position.y = -targetY * 4;
            camera.lookAt(2.5, 0, 0); // Regarde la planète
            
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (window.innerWidth < 900) { 
                planet.position.set(0, -1, 0); 
                camera.lookAt(0, -1, 0); 
                camera.position.set(0,0,12); // Dézoom sur mobile
            } else { 
                planet.position.set(2.5, 0, 0); 
                camera.lookAt(2.5, 0, 0); 
                camera.position.set(0,0,9);
            }
        });

        if (window.innerWidth < 900) { planet.position.set(0, -1, 0); camera.lookAt(0, -1, 0); camera.position.set(0,0,12); } 
        else { planet.position.set(2.5, 0, 0); }

        window.onload = () => { animate(); };
    </script>
</body>
</html>
