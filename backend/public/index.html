<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUFF ZONE - Explorez la nouvelle dimension</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- LOGO DE FOND ANIMÉ -->
    <div class="bg-logo">PUFF ZONE</div>
    <div class="nebula-bg"></div>
    <div class="overlay-dark"></div>
    <div class="stars"></div>

    <!-- EFFETS DE FOND ANIMÉS -->
    <div class="space-bg"></div>
    <div class="stars"></div>
    <div class="smoke"></div>

    <!-- HEADER -->
    <header class="header">
        <div class="logo">PUFF <span>ZONE</span></div>
        <div class="header-actions">
            <a href="/livreur.html" class="btn-header">🛵 Espace Livreur</a>
            <a href="/admin.html" class="btn-header">⚙️ Accès Admin</a>
            <div id="user-greeting" style="font-weight: bold; color: var(--neon-cyan); margin-left: 15px;">👋 Visiteur</div>
            <button id="cart-btn" class="btn-panier" onclick="toggleCart()">🛒 Panier (<span id="cart-count">0</span>)</button>
        </div>
    </header>

    <!-- SITE PRINCIPAL -->
    <main id="main-site" class="layout-principal">
        <!-- COLONNE GAUCHE : CATÉGORIES -->
        <aside class="sidebar-categories" id="categories-container">
            <!-- Injecté par script.js -->
        </aside>

        <!-- COLONNE DROITE : CATALOGUE -->
        <section class="contenu-catalogue">
            <h1>Le Catalogue</h1>
            <div class="grille-produits" id="product-list">
                <!-- Injecté par script.js -->
            </div>
        </section>
    </main>

    <!-- MODALE DE CONNEXION -->
    <div id="login-modal" style="display:flex; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; align-items:center; justify-content:center; backdrop-filter: blur(5px);">
        <div class="modal-content" style="background:var(--card); padding:30px; border-radius:10px; border:1px solid var(--neon-cyan); width:100%; max-width:400px; text-align:center; box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);">
            <h2 style="color:var(--neon-cyan); margin-top:0; font-family:'Orbitron', sans-serif; letter-spacing: 2px;">PUFF ZONE</h2>
            
            <!-- ÉCRAN 0 : CHOIX D'ACCUEIL -->
            <div id="step-choice">
                <p style="color:#aaa; font-size:14px; text-transform: uppercase; margin-bottom: 20px;">Bienvenue sur la boutique</p>
                <button onclick="showLoginForm()" class="btn-ajouter" style="margin-bottom: 10px;">Se Connecter</button>
                <button onclick="showRegisterForm()" class="btn-ajouter" style="background: transparent; border: 1px solid var(--neon-cyan); color: var(--neon-cyan); margin-bottom: 20px;">Créer un compte</button>
                
                <div style="border-top: 1px solid #333; padding-top: 15px; margin-top: 10px;">
                    <a href="/admin-login.html" style="color: #94A3B8; text-decoration: none; font-size: 12px; text-transform: uppercase; font-weight: bold;">⚙️ Accès Staff / Admin</a>
                </div>
            </div>

            <!-- ÉCRAN 1 : CONNEXION -->
            <div id="step-phone" style="display: none;">
                <p style="color:#aaa; font-size:14px; text-transform: uppercase; margin-bottom: 15px;">Connexion</p>
                <input type="text" id="phone-input" placeholder="Ton numéro de téléphone" style="width:100%; padding:12px; background:rgba(0,0,0,0.5); border:1px solid var(--border); color:white; border-radius:5px; margin-bottom:15px; box-sizing:border-box; outline:none;">
                <button onclick="checkPhone()" class="btn-ajouter" style="margin-bottom: 10px;">Continuer</button>
                <button onclick="backToChoice()" style="background:none; border:none; color:#aaa; cursor:pointer; font-size:12px;">← Retour</button>
            </div>

            <!-- ÉCRAN 2 : INSCRIPTION -->
            <div id="step-info" style="display:none;">
                <p style="color:#aaa; font-size:14px; text-transform: uppercase; margin-bottom: 15px;">Inscription</p>
                <input type="text" id="name-input" placeholder="Ton prénom/nom" style="width:100%; padding:12px; background:rgba(0,0,0,0.5); border:1px solid var(--border); color:white; border-radius:5px; margin-bottom:10px; box-sizing:border-box; outline:none;">
                <input type="text" id="phone-input-reg" placeholder="Ton numéro de téléphone" style="width:100%; padding:12px; background:rgba(0,0,0,0.5); border:1px solid var(--border); color:white; border-radius:5px; margin-bottom:10px; box-sizing:border-box; outline:none;">
                <input type="text" id="address-input" placeholder="Ton adresse" style="width:100%; padding:12px; background:rgba(0,0,0,0.5); border:1px solid var(--border); color:white; border-radius:5px; margin-bottom:10px; box-sizing:border-box; outline:none;">
                <input type="text" id="whatsapp-input" placeholder="Numéro WhatsApp" style="width:100%; padding:12px; background:rgba(0,0,0,0.5); border:1px solid var(--border); color:white; border-radius:5px; margin-bottom:15px; box-sizing:border-box; outline:none;">
                <button onclick="saveProfile()" class="btn-ajouter" style="margin-bottom: 10px;">S'inscrire</button>
                <button onclick="backToChoice()" style="background:none; border:none; color:#aaa; cursor:pointer; font-size:12px;">← Retour</button>
            </div>
        </div>
</div>

    <!-- TIROIR PANIER -->
    <div id="cart-drawer" style="position:fixed; top:0; right:-400px; width:350px; height:100%; background:var(--card); border-left:1px solid var(--border); z-index:10000; transition:right 0.3s; padding:20px; box-sizing:border-box; display:flex; flex-direction:column; backdrop-filter: blur(10px);">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #333; padding-bottom:15px;">
            <h2 style="margin:0; color:white; font-family:'Orbitron', sans-serif; font-size: 1.2rem;">🛒 Ton Panier</h2>
            <button onclick="toggleCart()" style="background:none; border:none; color:#ff6b6b; font-size:24px; cursor:pointer;">✕</button>
        </div>
        <div id="cart-items" style="flex-grow:1; overflow-y:auto; margin-top:20px;"></div>
        <div style="border-top:1px solid #333; padding-top:15px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-weight:bold;">
                <span style="color:#aaa;">Total :</span>
                <span id="cart-total-price" style="color:var(--neon-cyan); font-size:20px;">0 €</span>
            </div>
            <button onclick="checkout()" class="btn-ajouter">Valider la commande</button>
            <button onclick="logout()" style="width:100%; background:none; border:none; color:#ff6b6b; margin-top:15px; cursor:pointer; font-size:12px;">Se déconnecter</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
