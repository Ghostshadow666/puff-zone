<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUFF ZONE - Explorez la nouvelle dimension</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div class="nebula-bg"></div>
    <div class="overlay-dark"></div>
    <div id="canvas-container"></div>

    <img src="puff.png" class="floating-puff left" alt="Puff" onerror="this.style.display='none'">
    <img src="puff.png" class="floating-puff right" alt="Puff" onerror="this.style.display='none'">

    <header class="header">
        <div class="logo">PUFF <span>ZONE</span></div>
        <div class="header-actions">
            <a href="/livreur.html" class="btn-header">Livreur</a>
            <a href="/admin.html" class="btn-header">Admin</a>
            <div id="user-greeting" style="font-weight: 600; color: var(--white); font-size: 0.85rem;">&#128075; Visiteur</div>
            <button id="cart-btn" class="btn-panier" onclick="toggleCart()">Panier (<span id="cart-count">0</span>)</button>
        </div>
    </header>

    <main id="main-site" class="layout-principal" style="display: none;">
        <aside class="sidebar-categories" id="categories-container"></aside>
        <section class="contenu-catalogue">
            <h1>Le Catalogue</h1>
            <div class="grille-produits" id="product-list"></div>
        </section>
    </main>

    <!-- MODALE DE CONNEXION -->
    <div id="login-modal" style="display:flex; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; align-items:center; justify-content:center; backdrop-filter: blur(5px);">
        <div class="modal-content" style="background:var(--card); padding:30px; border-radius:8px; border:1px solid var(--border); width:90%; max-width:400px; text-align:center;">
            <h2 style="color:var(--white); margin-top:0; font-family:'Orbitron', sans-serif; letter-spacing: 2px;">PUFF ZONE</h2>
            <div id="step-choice">
                <p style="color:var(--text2); font-size:12px; text-transform: uppercase; margin-bottom: 20px; letter-spacing:1px;">Acc&egrave;s Syst&egrave;me</p>
                <button onclick="showLoginForm()" class="btn-panier" style="width:100%; margin-bottom: 10px; padding: 12px;">Se Connecter</button>
                <button onclick="showRegisterForm()" class="btn-header" style="width:100%; border-color:var(--border); margin-bottom: 20px; padding: 12px;">Cr&eacute;er un compte</button>
                <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; margin-top: 10px;">
                    <a href="/admin-login.html" style="color: var(--text2); text-decoration: none; font-size: 11px; text-transform: uppercase; font-weight: bold; letter-spacing:1px;">Acc&egrave;s Staff</a>
                </div>
            </div>
            <!-- Étapes de connexion et inscription (gardées identiques pour la stabilité) -->
            <div id="step-phone" style="display: none;">
                <input type="text" id="phone-input" placeholder="Num&eacute;ro de t&eacute;l&eacute;phone" style="width:100%; padding:12px; background:rgba(0,0,0,0.5); border:1px solid var(--border); color:white; border-radius:4px; margin-bottom:15px; box-sizing:border-box; outline:none;">
                <button onclick="checkPhone()" class="btn-panier" style="width:100%; margin-bottom: 10px; padding: 12px;">Continuer</button>
                <button onclick="backToChoice()" style="background:none; border:none; color:var(--text2); cursor:pointer; font-size:12px;">&larr; Retour</button>
            </div>
            <div id="step-info" style="display:none;">
                <input type="text" id="name-input" placeholder="Pr&eacute;nom/Nom" style="width:100%; padding:12px; background:rgba(0,0,0,0.5); border:1px solid var(--border); color:white; border-radius:4px; margin-bottom:10px; box-sizing:border-box; outline:none;">
                <input type="text" id="phone-input-reg" placeholder="T&eacute;l&eacute;phone" style="width:100%; padding:12px; background:rgba(0,0,0,0.5); border:1px solid var(--border); color:white; border-radius:4px; margin-bottom:10px; box-sizing:border-box; outline:none;">
                <input type="text" id="address-input" placeholder="Adresse" style="width:100%; padding:12px; background:rgba(0,0,0,0.5); border:1px solid var(--border); color:white; border-radius:4px; margin-bottom:10px; box-sizing:border-box; outline:none;">
                <input type="text" id="whatsapp-input" placeholder="WhatsApp (Optionnel)" style="width:100%; padding:12px; background:rgba(0,0,0,0.5); border:1px solid var(--border); color:white; border-radius:4px; margin-bottom:15px; box-sizing:border-box; outline:none;">
                <button onclick="saveProfile()" class="btn-panier" style="width:100%; margin-bottom: 10px; padding: 12px;">S'inscrire</button>
                <button onclick="backToChoice()" style="background:none; border:none; color:var(--text2); cursor:pointer; font-size:12px;">&larr; Retour</button>
            </div>
        </div>
    </div>

    <!-- PANIER -->
    <div id="cart-drawer">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:15px;">
            <h2 style="margin:0; color:white; font-family:'Orbitron', sans-serif; font-size: 1.1rem; letter-spacing:1px;">PANIER</h2>
            <button onclick="toggleCart()" style="background:none; border:none; color:var(--text2); font-size:20px; cursor:pointer;">&times;</button>
        </div>
        <div id="cart-items" style="flex-grow:1; overflow-y:auto; margin-top:20px;"></div>
        <div style="border-top:1px solid rgba(255,255,255,0.1); padding-top:15px;">
            <div id="promo-section" style="margin-bottom: 15px;">
                <div style="display:flex; gap:10px;">
                    <input type="text" id="promo-input" placeholder="CODE PROMO" style="flex:1; padding:10px; background:rgba(0,0,0,0.5); border:1px solid var(--border); color:white; border-radius:4px; outline:none; text-transform:uppercase; font-family:'Orbitron',sans-serif; font-size:0.8rem;">
                    <button onclick="applyPromo()" style="padding:10px 15px; background:var(--neon-cyan); color:black; border:none; border-radius:4px; font-weight:900; cursor:pointer; text-transform:uppercase;">OK</button>
                </div>
                <div id="promo-msg" style="font-size:12px; margin-top:5px; font-weight:bold;"></div>
            </div>
            <div style="margin-bottom: 15px;">
                <select id="zone-select" onchange="applyZone()" style="width:100%; padding:10px; background:rgba(0,0,0,0.5); border:1px solid var(--border); color:white; border-radius:4px; outline:none; font-weight:bold; font-size:0.85rem;">
                    <option value="">-- Choisir votre zone --</option>
                </select>
                <div id="zone-msg" style="font-size:12px; margin-top:5px; font-weight:bold;"></div>
            </div>
            <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-weight:bold;">
                <span style="color:var(--text2); font-size:0.9rem;">Total :</span>
                <span id="cart-total-price" style="color:var(--neon-cyan); font-size:20px; font-family:'Orbitron', sans-serif;">0 &euro;</span>
            </div>
            <button id="checkout-btn" onclick="checkout()" class="btn-panier" style="width:100%; padding:12px; font-size:0.9rem;">Valider la commande</button>
            <button onclick="logout()" style="width:100%; background:none; border:none; color:var(--red); margin-top:15px; cursor:pointer; font-size:11px; text-transform:uppercase; letter-spacing:1px;">Se d&eacute;connecter</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        window.appliedPromoCode = null; window.appliedPromoPct = 0;
        async function applyPromo() {
            const code = document.getElementById('promo-input').value.trim();
            const msg = document.getElementById('promo-msg');
            if (!code) { msg.textContent = "Veuillez entrer un code."; msg.style.color = "#ef4444"; return; }
            msg.textContent = "V&eacute;rification..."; msg.style.color = "#aaa";
            try {
                const res = await fetch('/api/promo/check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: code }) });
                const data = await res.json();
                if (data.success) {
                    window.appliedPromoCode = code; window.appliedPromoPct = data.pourcentage;
                    msg.innerHTML = `&#9989; Code appliqu&eacute; : -${data.pourcentage}%`; msg.style.color = "#10b981";
                    if (typeof updateCartUI === "function") updateCartUI();
                } else {
                    window.appliedPromoCode = null; window.appliedPromoPct = 0;
                    msg.innerHTML = `&#10060; ${data.error || 'Code invalide'}`; msg.style.color = "#ef4444";
                    if (typeof updateCartUI === "function") updateCartUI();
                }
            } catch (e) { msg.textContent = "Erreur"; msg.style.color = "#ef4444"; }
        }

        // --- PLANETE 3D FUTURISTE (WIREFRAME + ANNEAU FIN) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020204, 0.05);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Sphère Wireframe (Grille 3D)
        const sphereGeo = new THREE.SphereGeometry(2.2, 32, 32);
        const sphereMat = new THREE.MeshBasicMaterial({ 
            color: 0x00f0ff, 
            wireframe: true, 
            transparent: true, 
            opacity: 0.15 
        });
        const sphere = new THREE.Mesh(sphereGeo, sphereMat);
        sphere.position.set(2.5, 0, -1);
        scene.add(sphere);

        // Noyau interne (Lueur douce)
        const coreGeo = new THREE.SphereGeometry(2.0, 32, 32);
        const coreMat = new THREE.MeshBasicMaterial({ 
            color: 0x00f0ff, 
            transparent: true, 
            opacity: 0.05 
        });
        const core = new THREE.Mesh(coreGeo, coreMat);
        sphere.add(core);

        // --- ANNEAU ET TEXTE ---
        const orbitGroup = new THREE.Group();
        orbitGroup.rotation.x = Math.PI / 2.2; // Inclinaison de l'anneau
        orbitGroup.rotation.z = -Math.PI / 16;
        sphere.add(orbitGroup);

        // Ligne de l'anneau (Fine et blanche)
        const ringGeo = new THREE.RingGeometry(3.2, 3.25, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.3 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        orbitGroup.add(ring);

        // Texture du Texte (Corrigée pour être lisible)
        function createTextTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 2048, 128);
            
            ctx.font = '700 60px "Orbitron", sans-serif';
            ctx.fillStyle = '#ffffff'; 
            ctx.textAlign = 'center'; 
            ctx.textBaseline = 'middle';
            
            // On inverse le canvas pour compenser la vue de l'intérieur du cylindre Three.js
            ctx.scale(-1, 1); 
            ctx.translate(-2048, 0);

            for (let i = 0; i < 4; i++) { 
                ctx.fillText("PUFF ZONE", 256 + (i * 512), 64); 
            }
            return new THREE.CanvasTexture(canvas);
        }

        const textGeo = new THREE.CylinderGeometry(3.22, 3.22, 0.4, 64, 1, true);
        const textMat = new THREE.MeshBasicMaterial({ map: createTextTexture(), transparent: true, side: THREE.DoubleSide, depthWrite: false });
        const textRing = new THREE.Mesh(textGeo, textMat);
        textRing.rotation.x = Math.PI / 2;
        orbitGroup.add(textRing);

        // Particules d'étoiles
        const pCount = 1500; const pGeo = new THREE.BufferGeometry(); const pPos = new Float32Array(pCount * 3);
        for (let i = 0; i < pCount; i++) { pPos[i * 3] = (Math.random() - 0.5) * 30; pPos[i * 3 + 1] = (Math.random() - 0.5) * 30; pPos[i * 3 + 2] = (Math.random() - 0.5) * 30; }
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const starfield = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: 0.05, color: 0xffffff, transparent: true, opacity: 0.6 }));
        scene.add(starfield);

        // Parallaxe souris
        let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;
        document.addEventListener('mousemove', (e) => { mouseX = (e.clientX - window.innerWidth/2) * 0.0002; mouseY = (e.clientY - window.innerHeight/2) * 0.0002; });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            
            sphere.rotation.y = time * 0.02; // La sphère tourne très lentement
            
            // L'anneau et le texte tournent de gauche à droite
            orbitGroup.rotation.y = time * 0.1; 
            
            targetX += (mouseX - targetX) * 0.05; targetY += (mouseY - targetY) * 0.05;
            camera.position.x = targetX * 3; camera.position.y = -targetY * 3;
            camera.lookAt(2.5, 0, -1); // On regarde vers la sphère décalée
            
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (window.innerWidth < 768) { sphere.position.set(0, -1, -2); camera.lookAt(0, -1, -2); } else { sphere.position.set(2.5, 0, -1); camera.lookAt(2.5, 0, -1); }
        });

        if (window.innerWidth < 768) { sphere.position.set(0, -1, -2); camera.lookAt(0, -1, -2); } else { sphere.position.set(2.5, 0, -1); }
        window.onload = () => { animate(); };
    </script>
</body>
</html>
