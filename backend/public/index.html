<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUFF ZONE - Explorez la nouvelle dimension</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- LOGO DE FOND ANIMÃƒâ€° -->
    <div class="bg-watermark"></div>
    <div class="nebula-bg"></div>
    <div class="overlay-dark"></div>
    <div class="stars"></div>

    <!-- EFFETS DE FOND ANIMÃƒâ€°S -->
    <div class="space-bg"></div>
    <div class="stars"></div>
    <div class="smoke"></div>

    <!-- HEADER -->
    <header class="header">
        <div class="logo">PUFF <span>ZONE</span></div>
        <div class="header-actions">
            <a href="/livreur.html" class="btn-header">&#128757; Espace Livreur</a>
            <a href="/admin.html" class="btn-header">&#9881;&#65039; Acc&egrave;s Admin</a>
            <div id="user-greeting" style="font-weight: bold; color: var(--neon-cyan); margin-left: 15px;">&#128075; Visiteur</div>
            <button id="cart-btn" class="btn-panier" onclick="toggleCart()">&#128722; Panier (<span id="cart-count">0</span>)</button>
        </div>
    </header>

    <!-- SITE PRINCIPAL -->
    <main id="main-site" class="layout-principal">
        <!-- COLONNE GAUCHE : CATÃƒâ€°GORIES -->
        <aside class="sidebar-categories" id="categories-container">
            <!-- InjectÃƒÂ© par script.js -->
        </aside>

        <!-- COLONNE DROITE : CATALOGUE -->
        <section class="contenu-catalogue">
            <h1>Le Catalogue</h1>
            <div class="grille-produits" id="product-list">
                <!-- InjectÃƒÂ© par script.js -->
            </div>
        </section>
    </main>

    <!-- MODALE DE CONNEXION -->
    <div id="login-modal" style="display:flex; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; align-items:center; justify-content:center; backdrop-filter: blur(5px);">
        <div class="modal-content" style="background:var(--card); padding:30px; border-radius:10px; border:1px solid var(--neon-cyan); width:100%; max-width:400px; text-align:center; box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);">
            <h2 style="color:var(--neon-cyan); margin-top:0; font-family:'Orbitron', sans-serif; letter-spacing: 2px;">PUFF ZONE</h2>
            
            <!-- Ãƒâ€°CRAN 0 : CHOIX D'ACCUEIL -->
            <div id="step-choice">
                <p style="color:#aaa; font-size:14px; text-transform: uppercase; margin-bottom: 20px;">Bienvenue sur la boutique</p>
                <button onclick="showLoginForm()" class="btn-ajouter" style="margin-bottom: 10px;">Se Connecter</button>
                <button onclick="showRegisterForm()" class="btn-ajouter" style="background: transparent; border: 1px solid var(--neon-cyan); color: var(--neon-cyan); margin-bottom: 20px;">Cr&eacute;er un compte</button>
                
                <div style="border-top: 1px solid #333; padding-top: 15px; margin-top: 10px;">
                    <a href="/admin-login.html" style="color: #94A3B8; text-decoration: none; font-size: 12px; text-transform: uppercase; font-weight: bold;">&#9881;&#65039; Acc&egrave;s Staff / Admin</a>
                </div>
            </div>

            <!-- Ãƒâ€°CRAN 1 : CONNEXION -->
            <div id="step-phone" style="display: none;">
                <p style="color:#aaa; font-size:14px; text-transform: uppercase; margin-bottom: 15px;">Connexion</p>
                <input type="text" id="phone-input" placeholder="Ton num&eacute;ro de t&eacute;l&eacute;phone" style="width:100%; padding:12px; background:rgba(0,0,0,0.5); border:1px solid var(--border); color:white; border-radius:5px; margin-bottom:15px; box-sizing:border-box; outline:none;">
                <button onclick="checkPhone()" class="btn-ajouter" style="margin-bottom: 10px;">Continuer</button>
                <button onclick="backToChoice()" style="background:none; border:none; color:#aaa; cursor:pointer; font-size:12px;">&larr; Retour</button>
            </div>

            <!-- Ãƒâ€°CRAN 2 : INSCRIPTION -->
            <div id="step-info" style="display:none;">
                <p style="color:#aaa; font-size:14px; text-transform: uppercase; margin-bottom: 15px;">Inscription</p>
                <input type="text" id="name-input" placeholder="Ton pr&eacute;nom/nom" style="width:100%; padding:12px; background:rgba(0,0,0,0.5); border:1px solid var(--border); color:white; border-radius:5px; margin-bottom:10px; box-sizing:border-box; outline:none;">
                <input type="text" id="phone-input-reg" placeholder="Ton num&eacute;ro de t&eacute;l&eacute;phone" style="width:100%; padding:12px; background:rgba(0,0,0,0.5); border:1px solid var(--border); color:white; border-radius:5px; margin-bottom:10px; box-sizing:border-box; outline:none;">
                <input type="text" id="address-input" placeholder="Ton adresse" style="width:100%; padding:12px; background:rgba(0,0,0,0.5); border:1px solid var(--border); color:white; border-radius:5px; margin-bottom:10px; box-sizing:border-box; outline:none;">
                <input type="text" id="whatsapp-input" placeholder="Num&eacute;ro WhatsApp" style="width:100%; padding:12px; background:rgba(0,0,0,0.5); border:1px solid var(--border); color:white; border-radius:5px; margin-bottom:15px; box-sizing:border-box; outline:none;">
                <button onclick="saveProfile()" class="btn-ajouter" style="margin-bottom: 10px;">S'inscrire</button>
                <button onclick="backToChoice()" style="background:none; border:none; color:#aaa; cursor:pointer; font-size:12px;">&larr; Retour</button>
            </div>
        </div>
    </div>

    <!-- TIROIR PANIER -->
    <div id="cart-drawer" style="position:fixed; top:0; right:-400px; width:350px; height:100%; background:var(--card); border-left:1px solid var(--border); z-index:10000; transition:right 0.3s; padding:20px; box-sizing:border-box; display:flex; flex-direction:column; backdrop-filter: blur(10px);">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #333; padding-bottom:15px;">
            <h2 style="margin:0; color:white; font-family:'Orbitron', sans-serif; font-size: 1.2rem;">&#128722; Ton Panier</h2>
            <button onclick="toggleCart()" style="background:none; border:none; color:#ff6b6b; font-size:24px; cursor:pointer;">&times;</button>
        </div>
        <div id="cart-items" style="flex-grow:1; overflow-y:auto; margin-top:20px;"></div>
        
        <div style="border-top:1px solid #333; padding-top:15px;">
            
            <!-- NOUVEAU : CHAMP CODE PROMO -->
            <div id="promo-section" style="margin-bottom: 15px;">
                <div style="display:flex; gap:10px;">
                    <input type="text" id="promo-input" placeholder="CODE PROMO" style="flex:1; padding:10px; background:rgba(0,0,0,0.5); border:1px solid var(--border); color:white; border-radius:5px; outline:none; text-transform:uppercase; font-family:'Rajdhani',sans-serif; font-weight:bold;">
                    <button onclick="applyPromo()" style="padding:10px 15px; background:var(--neon-cyan); color:black; border:none; border-radius:5px; font-weight:900; cursor:pointer; text-transform:uppercase;">OK</button>
                </div>
                <div id="promo-msg" style="font-size:12px; margin-top:5px; font-weight:bold;"></div>
            </div>

            <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-weight:bold;">
                <span style="color:#aaa;">Total :</span>
                <span id="cart-total-price" style="color:var(--neon-cyan); font-size:20px;">0 &euro;</span>
            </div>
            <button id="checkout-btn" onclick="checkout()" class="btn-ajouter">Valider la commande</button>
            <button onclick="logout()" style="width:100%; background:none; border:none; color:#ff6b6b; margin-top:15px; cursor:pointer; font-size:12px;">Se d&eacute;connecter</button>
        </div>
    </div>

    <script src="script.js"></script>
    
    <!-- SCRIPT POUR LE CODE PROMO -->
    <script>
        window.appliedPromoCode = null;
        window.appliedPromoPct = 0;

        async function applyPromo() {
            const code = document.getElementById('promo-input').value.trim();
            const msg = document.getElementById('promo-msg');
            if (!code) {
                msg.textContent = "Veuillez entrer un code.";
                msg.style.color = "#EF4444";
                return;
            }

            msg.textContent = "V&eacute;rification...";
            msg.style.color = "#aaa";

            try {
                const res = await fetch('/api/promo/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code })
                });
                const data = await res.json();

                if (data.success) {
                    window.appliedPromoCode = code;
                    window.appliedPromoPct = data.pourcentage;
                    msg.innerHTML = `&#9989; Code appliqu&eacute; : -${data.pourcentage}%`;
                    msg.style.color = "#22C55E";
                    
                    if (typeof updateCartUI === "function") {
                        updateCartUI();
                    } else {
                        const totalEl = document.getElementById('cart-total-price');
                        let currentTotal = parseFloat(totalEl.textContent.replace(' Ã¢â€šÂ¬', '').replace(',', '.'));
                        let newTotal = currentTotal - (currentTotal * (data.pourcentage / 100));
                        totalEl.innerHTML = newTotal.toFixed(2).replace('.', ',') + ' &euro;';
                    }
                } else {
                    window.appliedPromoCode = null;
                    window.appliedPromoPct = 0;
                    msg.innerHTML = `&#10060; ${data.error || 'Code invalide'}`;
                    msg.style.color = "#EF4444";
                }
            } catch (e) {
                msg.textContent = "Erreur de connexion";
                msg.style.color = "#EF4444";
            }
        }
    </script>
</body>
</html>
