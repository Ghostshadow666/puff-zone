<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUFF ZONE - Explore une autre dimension</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* STYLE POUR LA VAPOTE EN DECO */
        .puff-deco {
            position: fixed;
            bottom: 5%;
            right: 5%;
            width: 250px;
            z-index: -1;
            opacity: 0.8;
            pointer-events: none;
            filter: drop-shadow(0 0 30px rgba(34, 211, 238, 0.4)) drop-shadow(0 0 60px rgba(168, 85, 247, 0.2));
            animation: floatPuff 6s ease-in-out infinite;
        }
        
        @keyframes floatPuff {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }

        @media (max-width: 768px) {
            .puff-deco { width: 150px; right: -20px; bottom: 10%; opacity: 0.5; }
        }
    </style>
</head>
<body>
    <!-- FOND ANIMÉ -->
    <canvas id="bg-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none;"></canvas>

    <!-- VAPOTE EN DECO (Assure-toi que puff.png est bien dans le dossier public) -->
    <img src="puff.png" class="puff-deco" alt="Puff Zone" onerror="this.style.display='none'">

    <header class="header">
        <div class="logo">✦ PUFF<span>ZONE</span></div>
        <div class="header-actions">
            <a href="/livreur.html" class="btn-header">Espace Livreur</a>
            <a href="/admin.html" class="btn-header">Admin</a>
            <div id="user-greeting" style="font-weight: 600; color: var(--text2); font-size: 0.9rem;">&#128075; Visiteur</div>
            <button id="cart-btn" class="btn-panier" onclick="toggleCart()">Panier (<span id="cart-count">0</span>)</button>
        </div>
    </header>

    <section class="hero-section">
        <div class="hero-subtitle">Boutique Officielle</div>
        <h1 class="hero-title">Explore une<br><span>autre dimension.</span></h1>
        <p class="hero-desc">Des saveurs uniques à découvrir. Plonge dans l'univers PUFF ZONE.</p>
    </section>

    <main id="main-site" class="layout-principal" style="display: none;">
        <div class="grille-produits" id="product-list"></div>
    </main>

    <!-- MODALE DE CONNEXION -->
    <div id="login-modal" style="display:flex; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(2, 1, 8, 0.85); z-index:9999; align-items:center; justify-content:center; backdrop-filter: blur(10px);">
        <div class="modal-content" style="background:var(--card-bg); padding:40px; border-radius:20px; border:1px solid var(--card-border); width:90%; max-width:400px; text-align:center; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
            <h2 style="color:var(--text); margin-top:0; font-family:'Orbitron', sans-serif; letter-spacing: 2px;">PUFF ZONE</h2>
            <div id="step-choice">
                <p style="color:var(--text2); font-size:14px; text-transform: uppercase; margin-bottom: 25px; letter-spacing:2px;">Bienvenue</p>
                <button onclick="showLoginForm()" class="btn-panier" style="width:100%; margin-bottom: 15px; padding: 14px; border-radius:10px;">Se Connecter</button>
                <button onclick="showRegisterForm()" class="btn-header" style="width:100%; border-color:var(--card-border); margin-bottom: 25px; padding: 14px; border-radius:10px;">Cr&eacute;er un compte</button>
                <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; margin-top: 10px;">
                    <a href="/admin-login.html" style="color: var(--text2); text-decoration: none; font-size: 11px; text-transform: uppercase; font-weight: bold; letter-spacing:1px;">Acc&egrave;s Staff</a>
                </div>
            </div>
            <div id="step-phone" style="display: none;">
                <input type="text" id="phone-input" placeholder="Num&eacute;ro de t&eacute;l&eacute;phone" style="width:100%; margin-bottom:20px;">
                <button onclick="checkPhone()" class="btn-panier" style="width:100%; margin-bottom: 15px; padding: 14px; border-radius:10px;">Continuer</button>
                <button onclick="backToChoice()" style="background:none; border:none; color:var(--text2); cursor:pointer; font-size:12px;">&larr; Retour</button>
            </div>
            <div id="step-info" style="display:none;">
                <input type="text" id="name-input" placeholder="Pr&eacute;nom/Nom" style="width:100%; margin-bottom:15px;">
                <input type="text" id="phone-input-reg" placeholder="T&eacute;l&eacute;phone" style="width:100%; margin-bottom:15px;">
                <input type="text" id="address-input" placeholder="Adresse" style="width:100%; margin-bottom:15px;">
                <input type="text" id="whatsapp-input" placeholder="WhatsApp (Optionnel)" style="width:100%; margin-bottom:20px;">
                <button onclick="saveProfile()" class="btn-panier" style="width:100%; margin-bottom: 15px; padding: 14px; border-radius:10px;">S'inscrire</button>
                <button onclick="backToChoice()" style="background:none; border:none; color:var(--text2); cursor:pointer; font-size:12px;">&larr; Retour</button>
            </div>
        </div>
    </div>

    <!-- PANIER DRAWER -->
    <div id="cart-drawer">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:20px;">
            <h2 style="margin:0; color:var(--text); font-family:'Outfit', sans-serif; font-size: 1.4rem; letter-spacing:1px;">Ton Panier</h2>
            <button onclick="toggleCart()" style="background:none; border:none; color:var(--text2); font-size:28px; cursor:pointer;">&times;</button>
        </div>
        <div id="cart-items" style="flex-grow:1; overflow-y:auto; margin-top:25px;"></div>
        <div style="border-top:1px solid rgba(255,255,255,0.1); padding-top:20px;">
            <div id="promo-section" style="margin-bottom: 20px;">
                <div style="display:flex; gap:10px;">
                    <input type="text" id="promo-input" placeholder="CODE PROMO" style="flex:1; text-transform:uppercase;">
                    <button onclick="applyPromo()" style="padding:12px 20px; background:var(--neon-cyan); color:black; border:none; border-radius:10px; font-weight:900; cursor:pointer; text-transform:uppercase; transition:0.3s;">OK</button>
                </div>
                <div id="promo-msg" style="font-size:12px; margin-top:8px; font-weight:bold;"></div>
            </div>
            <div style="margin-bottom: 20px;">
                <select id="zone-select" onchange="applyZone()" style="width:100%;">
                    <option value="">-- Choisir votre zone --</option>
                </select>
                <div id="zone-msg" style="font-size:12px; margin-top:8px; font-weight:bold;"></div>
            </div>
            <div style="display:flex; justify-content:space-between; margin-bottom:20px; font-weight:bold; align-items:center;">
                <span style="color:var(--text2); font-size:1rem;">Total :</span>
                <span id="cart-total-price" style="color:var(--neon-cyan); font-size:24px; font-weight:900; text-shadow:0 0 10px rgba(34,211,238,0.4);">0 &euro;</span>
            </div>
            <button id="checkout-btn" onclick="checkout()" class="btn-panier" style="width:100%; padding:16px; font-size:1rem; border-radius:10px;">Valider la commande</button>
            <button onclick="logout()" style="width:100%; background:none; border:none; color:var(--red); margin-top:20px; cursor:pointer; font-size:12px; text-transform:uppercase; letter-spacing:1px; opacity:0.8;">Se d&eacute;connecter</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="bg-animation.js"></script>
    <script>
        // LOGIQUE PROMO (Inchangée)
        window.appliedPromoCode = null; window.appliedPromoPct = 0;
        async function applyPromo() {
            const code = document.getElementById('promo-input').value.trim();
            const msg = document.getElementById('promo-msg');
            if (!code) { msg.textContent = "Veuillez entrer un code."; msg.style.color = "#EF4444"; return; }
            msg.textContent = "V&eacute;rification..."; msg.style.color = "#aaa";
            try {
                const res = await fetch('/api/promo/check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: code }) });
                const data = await res.json();
                if (data.success) {
                    window.appliedPromoCode = code; window.appliedPromoPct = data.pourcentage;
                    msg.innerHTML = `&#9989; Code appliqu&eacute; : -${data.pourcentage}%`; msg.style.color = "#10B981";
                    if (typeof updateCartUI === "function") updateCartUI();
                } else {
                    window.appliedPromoCode = null; window.appliedPromoPct = 0;
                    msg.innerHTML = `&#10060; ${data.error || 'Code invalide'}`; msg.style.color = "#EF4444";
                    if (typeof updateCartUI === "function") updateCartUI();
                }
            } catch (e) { msg.textContent = "Erreur"; msg.style.color = "#EF4444"; }
        }
    </script>
</body>
</html>
