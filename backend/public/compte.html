<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUFF ZONE - Mon Compte</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        .account-container { max-width: 700px; margin: 50px auto; padding: 0 20px; position: relative; z-index: 10; }
        .account-card { background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--card-border); border-radius: 20px; padding: 30px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        .account-card h2 { font-family: 'Outfit', sans-serif; font-weight: 600; color: var(--text); margin-top: 0; margin-bottom: 25px; font-size: 1.3rem; display: flex; align-items: center; gap: 10px; }
        .form-group { margin-bottom: 20px; }
        .form-group input { width: 100%; padding: 14px 15px; background: rgba(0,0,0,0.4); border: 1px solid var(--card-border); color: white; border-radius: 10px; box-sizing: border-box; font-family: 'Outfit', sans-serif; font-size: 16px; outline: none; transition: 0.3s; }
        .form-group input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(34,211,238,0.2); }
        .btn-save { width: 100%; padding: 15px; background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan)); color: white; border: none; border-radius: 10px; font-weight: 800; font-size: 15px; cursor: pointer; transition: 0.3s; text-transform: uppercase; font-family: 'Outfit', sans-serif; letter-spacing: 1px; }
        .btn-save:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(168, 85, 247, 0.4);}
        .commande-item { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 15px; margin-bottom: 15px; }
        .commande-info h3 { margin: 0 0 8px 0; font-size: 1.1rem; color: var(--text); font-weight:600;}
        .commande-info p { margin: 0; font-size: 0.85rem; color: var(--text2); }
        .commande-price { text-align: right; }
        .commande-price .prix { font-size: 1.3rem; font-weight: 800; color: var(--neon-cyan); }
        .commande-price .statut { font-size: 0.8rem; color: var(--green); text-transform: uppercase; font-weight: bold; margin-top:5px;}
        .top-nav { display: flex; justify-content: center; gap: 20px; margin-bottom: 40px; }
        .top-nav a { color: var(--text); text-decoration: none; font-weight: 600; border: 1px solid var(--card-border); padding: 10px 20px; border-radius: 20px; transition: 0.3s; background: var(--card-bg); backdrop-filter: blur(10px);}
        .top-nav a:hover { border-color: var(--neon-cyan); color: var(--neon-cyan); background: rgba(34,211,238,0.1); }
        .top-nav a.logout { color: var(--red); border-color: rgba(239, 68, 68, 0.3); }
        .top-nav a.logout:hover { background: rgba(239,68,68,0.1); box-shadow: 0 0 10px rgba(239,68,68,0.3);}
        
        /* TIMELINE CSS */
        .commande-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 15px; padding: 25px; margin-bottom: 20px; }
        .commande-header { display: flex; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; }
        .commande-header h3 { margin: 0; color: var(--text); font-weight:600;}
        .commande-header .prix { color: var(--neon-cyan); font-weight: 800; font-size: 1.3rem; }
        .timeline { display: flex; justify-content: space-between; position: relative; margin-top: 25px; }
        .timeline::before { content: ''; position: absolute; top: 10px; left: 0; right: 0; height: 2px; background: rgba(255,255,255,0.1); z-index: 1; }
        .step { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; width: 25%; }
        .step-dot { width: 22px; height: 22px; border-radius: 50%; background: #222; border: 2px solid #555; margin-bottom: 10px; transition: 0.3s; }
        .step-label { font-size: 0.75rem; text-align: center; color: var(--text2); font-weight: 600; text-transform: uppercase; letter-spacing:1px;}

        .step.active .step-dot { background: var(--neon-cyan); border-color: var(--neon-cyan); box-shadow: 0 0 15px var(--neon-cyan); }
        .step.active .step-label { color: var(--neon-cyan); }
        .step.done .step-dot { background: var(--green); border-color: var(--green); box-shadow: 0 0 10px rgba(16,185,129,0.4);}
        .step.done .step-label { color: var(--green); }
    </style>
</head>
<body>
    <div class="account-container">
        <div class="top-nav">
            <a href="/">← Retour Boutique</a>
            <a href="#" onclick="logout()" class="logout">Déconnexion</a>
        </div>

        <div class="account-card">
            <h2>👤 Mes Informations</h2>
            <div class="form-group"><input type="text" id="nom" placeholder="Nom complet"></div>
            <div class="form-group"><input type="text" id="telephone" disabled style="opacity: 0.5; cursor: not-allowed;"></div>
            <div class="form-group"><input type="text" id="adresse" placeholder="Adresse de livraison"></div>
            <div class="form-group"><input type="text" id="whatsapp" placeholder="Numéro WhatsApp (Optionnel)"></div>
            <button class="btn-save" onclick="updateProfile()">Enregistrer les modifications</button>
        </div>

        <div class="account-card">
            <h2>📦 Suivi de mes Commandes</h2>
            <div id="mesCommandes" style="text-align: center; color: var(--text2); font-style: italic;">Chargement...</div>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        let currentUser = JSON.parse(localStorage.getItem('puff_client'));
        if (!currentUser || !currentUser.id) { alert("Session expirée."); window.location.href = '/'; }

        document.getElementById('nom').value = currentUser.nom || '';
        document.getElementById('telephone').value = currentUser.telephone || '';
        document.getElementById('adresse').value = currentUser.adresse || '';
        document.getElementById('whatsapp').value = currentUser.whatsapp || '';

        async function updateProfile() {
            const nom = document.getElementById('nom').value;
            const adresse = document.getElementById('adresse').value;
            const whatsapp = document.getElementById('whatsapp').value;
            try {
                const res = await fetch(`${API_URL}/clients/${currentUser.id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nom, adresse, whatsapp }) });
                const data = await res.json();
                if (data.success) { localStorage.setItem('puff_client', JSON.stringify(data.client)); alert("✅ Profil mis à jour !"); window.location.reload(); }
            } catch (e) { alert("Erreur."); }
        }

        async function loadMesCommandes() {
            try {
                const res = await fetch(`${API_URL}/clients/${currentUser.id}/commandes`);
                const commandes = await res.json();
                const container = document.getElementById('mesCommandes');

                if (!commandes || commandes.length === 0) { container.innerHTML = "Aucune commande pour le moment.";return; }

                container.innerHTML = commandes.map(cmd => {
                    const statut = cmd.statut.toLowerCase();
                    let step1 = 'active', step2 = '', step3 = '', step4 = '';

                    if (statut === 'en_preparation' || statut === 'preparation') { step1 = 'done'; step2 = 'active';}
                    if (statut === 'en_livraison' || statut === 'livraison') { step1 = 'done'; step2 = 'done'; step3= 'active'; }
                    if (statut === 'livre' || statut === 'livré') { step1 = 'done'; step2 = 'done'; step3 = 'done'; step4 = 'done'; }

                    return `
                    <div class="commande-card">
                        <div class="commande-header">
                            <h3>Commande #${cmd.id}</h3>
                            <span class="prix">${parseFloat(cmd.total).toFixed(2)} €</span>
                        </div>
                        <div style="font-size: 0.85rem; color: var(--text2); margin-bottom: 20px;">Passée le ${new Date(cmd.date_commande).toLocaleString('fr-FR')}</div>

                        <div class="timeline">
                            <div class="step ${step1}"><div class="step-dot"></div><div class="step-label">Reçue</div></div>
                            <div class="step ${step2}"><div class="step-dot"></div><div class="step-label">Prépa</div></div>
                            <div class="step ${step3}"><div class="step-dot"></div><div class="step-label">Livraison</div></div>
                            <div class="step ${step4}"><div class="step-dot"></div><div class="step-label">Livré</div></div>
                        </div>
                    </div>`;
                }).join('');
            } catch (e) { document.getElementById('mesCommandes').innerHTML = "Erreur de chargement."; }
        }
        function logout() { localStorage.removeItem('puff_client'); window.location.href = '/'; }
        loadMesCommandes();
    </script>
</body>
</html>
