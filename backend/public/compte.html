<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUFF ZONE - Mon Compte</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .account-container { max-width: 600px; margin: 40px auto; padding: 0 20px; position: relative; z-index: 10; }
        .account-card { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 30px; margin-bottom: 30px; box-shadow: 0 0 20px rgba(0, 243, 255, 0.05); backdrop-filter: blur(10px); }
        .account-card h2 { font-family: 'Orbitron', sans-serif; color: var(--neon-cyan); margin-top: 0; margin-bottom: 20px; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group input { width: 100%; padding: 12px; background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: white; border-radius: 8px; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; font-size: 16px; outline: none; transition: 0.3s; }
        .form-group input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0, 243, 255, 0.2); }
        .btn-save { width: 100%; padding: 14px; background: transparent; color: var(--neon-cyan); border: 1px solid var(--neon-cyan); border-radius: 8px; font-weight: 900; font-size: 14px; cursor: pointer; transition: 0.3s; text-transform: uppercase; font-family: 'Rajdhani', sans-serif; letter-spacing: 1px; }
        .btn-save:hover { background: var(--neon-cyan); color: black; box-shadow: 0 0 15px var(--neon-cyan); }
        .commande-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; }
        .commande-info h3 { margin: 0 0 5px 0; font-size: 1rem; color: white; }
        .commande-info p { margin: 0; font-size: 0.8rem; color: #888; }
        .commande-price { text-align: right; }
        .commande-price .prix { font-size: 1.2rem; font-weight: 900; color: var(--neon-cyan); }
        .commande-price .statut { font-size: 0.75rem; color: #22C55E; text-transform: uppercase; font-weight: bold; }
        .top-nav { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
        .top-nav a { color: var(--neon-cyan); text-decoration: none; font-weight: 700; border: 1px solid var(--border); padding: 8px 16px; border-radius: 8px; transition: 0.3s; }
        .top-nav a:hover { background: rgba(0, 243, 255, 0.1); }
        .top-nav a.logout { color: #EF4444; border-color: rgba(239, 68, 68, 0.3); }
    </style>
</head>
<body>
    <div class="nebula-bg"></div>
    <div class="overlay-dark"></div>
    <div class="stars"></div>

    <div class="account-container">
        <div class="top-nav">
            <a href="/">← Retour Boutique</a>
            <a href="#" onclick="logout()" class="logout">Déconnexion</a>
        </div>

        <div class="account-card">
            <h2>👤 Mes Informations</h2>
            <div class="form-group">
                <input type="text" id="nom" placeholder="Nom complet">
            </div>
            <div class="form-group">
                <input type="text" id="telephone" disabled style="opacity: 0.6; cursor: not-allowed;">
            </div>
            <div class="form-group">
                <input type="text" id="adresse" placeholder="Adresse de livraison">
            </div>
            <div class="form-group">
                <input type="text" id="whatsapp" placeholder="Numéro WhatsApp (Optionnel)">
            </div>
            <button class="btn-save" onclick="updateProfile()">Enregistrer les modifications</button>
        </div>

        <div class="account-card">
            <h2>📦 Mes Commandes</h2>
            <div id="mesCommandes" style="text-align: center; color: #888; font-style: italic;">Chargement...</div>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        let currentUser = JSON.parse(localStorage.getItem('puff_client'));

        if (!currentUser || !currentUser.id) {
            alert("Votre session a expiré. Veuillez vous reconnecter.");
            window.location.href = '/';
        }

        // Remplir les champs
        document.getElementById('nom').value = currentUser.nom || '';
        document.getElementById('telephone').value = currentUser.telephone || '';
        document.getElementById('adresse').value = currentUser.adresse || '';
        document.getElementById('whatsapp').value = currentUser.whatsapp || '';

        async function updateProfile() {
            const nom = document.getElementById('nom').value;
            const adresse = document.getElementById('adresse').value;
            const whatsapp = document.getElementById('whatsapp').value;

            try {
                const res = await fetch(`${API_URL}/clients/${currentUser.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nom, adresse, whatsapp })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('puff_client', JSON.stringify(data.client));
                    alert("✅ Profil mis à jour !");
                    window.location.reload();
                }
            } catch (e) { alert("Erreur de connexion."); }
        }

        async function loadMesCommandes() {
            try {
                const res = await fetch(`${API_URL}/clients/${currentUser.id}/commandes`);
                const commandes = await res.json();
                const container = document.getElementById('mesCommandes');

                if (!commandes || commandes.length === 0) {
                    container.innerHTML = "Aucune commande pour le moment.";
                    return;
                }

                container.innerHTML = commandes.map(cmd => `
                    <div class="commande-item">
                        <div class="commande-info">
                            <h3>Commande #${cmd.id}</h3>
                            <p>${new Date(cmd.date_commande).toLocaleString('fr-FR')}</p>
                        </div>
                        <div class="commande-price">
                            <div class="prix">${parseFloat(cmd.total).toFixed(2)} €</div>
                            <div class="statut">${cmd.statut.replace('_', ' ')}</div>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('mesCommandes').innerHTML = "Erreur de chargement.";
            }
        }

        function logout() {
            localStorage.removeItem('puff_client');
            window.location.href = '/';
        }

        // Lancer le chargement des commandes
        loadMesCommandes();
    </script>
</body>
</html>
