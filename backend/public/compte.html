<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUFF ZONE - Mon Compte</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .account-container { max-width: 600px; margin: 40px auto; padding: 0 20px; position: relative; z-index: 10; }
        .account-card { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 30px; margin-bottom: 30px; box-shadow: 0 0 20px rgba(0, 243, 255, 0.05); backdrop-filter: blur(10px); }
        .account-card h2 { font-family: 'Orbitron', sans-serif; color: var(--neon-cyan); margin-top: 0; margin-bottom: 20px; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group input { width: 100%; padding: 12px; background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: white; border-radius: 8px; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; font-size: 16px; outline: none; }
        .btn-save { width: 100%; padding: 14px; background: transparent; color: var(--neon-cyan); border: 1px solid var(--neon-cyan); border-radius: 8px; font-weight: 900; font-size: 14px; cursor: pointer; text-transform: uppercase; font-family: 'Rajdhani', sans-serif; }
        .btn-save:hover { background: var(--neon-cyan); color: black; }
        
        /* TIMELINE CSS */
        .commande-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 15px; }
        .commande-header { display: flex; justify-content: space-between; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .commande-header h3 { margin: 0; color: white; }
        .commande-header .prix { color: var(--neon-cyan); font-weight: 900; font-size: 1.2rem; }
        .timeline { display: flex; justify-content: space-between; position: relative; margin-top: 20px; }
        .timeline::before { content: ''; position: absolute; top: 10px; left: 0; right: 0; height: 2px; background: rgba(255,255,255,0.1); z-index: 1; }
        .step { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; width: 25%; }
        .step-dot { width: 20px; height: 20px; border-radius: 50%; background: #222; border: 2px solid #555; margin-bottom: 8px; transition: 0.3s; }
        .step-label { font-size: 0.7rem; text-align: center; color: #666; font-weight: bold; text-transform: uppercase; }
        
        .step.active .step-dot { background: var(--neon-cyan); border-color: var(--neon-cyan); box-shadow: 0 0 10px var(--neon-cyan); }
        .step.active .step-label { color: var(--neon-cyan); }
        .step.done .step-dot { background: #22C55E; border-color: #22C55E; }
        .step.done .step-label { color: #22C55E; }

        .top-nav { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
        .top-nav a { color: var(--neon-cyan); text-decoration: none; font-weight: 700; border: 1px solid var(--border); padding: 8px 16px; border-radius: 8px; }
        .top-nav a.logout { color: #EF4444; border-color: rgba(239, 68, 68, 0.3); }
    </style>
</head>
<body>
    <div class="nebula-bg"></div>
    <div class="overlay-dark"></div>
    <div class="stars"></div>

    <div class="account-container">
        <div class="top-nav">
            <a href="/">← Retour Boutique</a>
            <a href="#" onclick="logout()" class="logout">Déconnexion</a>
        </div>

        <div class="account-card">
            <h2>👤 Mes Informations</h2>
            <div class="form-group"><input type="text" id="nom" placeholder="Nom complet"></div>
            <div class="form-group"><input type="text" id="telephone" disabled style="opacity: 0.6;"></div>
            <div class="form-group"><input type="text" id="adresse" placeholder="Adresse de livraison"></div>
            <div class="form-group"><input type="text" id="whatsapp" placeholder="Numéro WhatsApp (Optionnel)"></div>
            <button class="btn-save" onclick="updateProfile()">Enregistrer les modifications</button>
        </div>

        <div class="account-card">
            <h2>📦 Suivi de mes Commandes</h2>
            <div id="mesCommandes" style="text-align: center; color: #888; font-style: italic;">Chargement...</div>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        let currentUser = JSON.parse(localStorage.getItem('puff_client'));
        if (!currentUser || !currentUser.id) { alert("Session expirée."); window.location.href = '/'; }

        document.getElementById('nom').value = currentUser.nom || '';
        document.getElementById('telephone').value = currentUser.telephone || '';
        document.getElementById('adresse').value = currentUser.adresse || '';
        document.getElementById('whatsapp').value = currentUser.whatsapp || '';

        async function updateProfile() {
            const nom = document.getElementById('nom').value;
            const adresse = document.getElementById('adresse').value;
            const whatsapp = document.getElementById('whatsapp').value;
            try {
                const res = await fetch(`${API_URL}/clients/${currentUser.id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nom, adresse, whatsapp }) });
                const data = await res.json();
                if (data.success) { localStorage.setItem('puff_client', JSON.stringify(data.client)); alert("✅ Profil mis à jour !"); window.location.reload(); }
            } catch (e) { alert("Erreur."); }
        }

        async function loadMesCommandes() {
            try {
                const res = await fetch(`${API_URL}/clients/${currentUser.id}/commandes`);
                const commandes = await res.json();
                const container = document.getElementById('mesCommandes');

                if (!commandes || commandes.length === 0) { container.innerHTML = "Aucune commande pour le moment."; return; }

                container.innerHTML = commandes.map(cmd => {
                    // Gestion des étapes de la timeline
                    const statut = cmd.statut.toLowerCase();
                    let step1 = 'active', step2 = '', step3 = '', step4 = '';
                    
                    if (statut === 'en_preparation' || statut === 'preparation') { step1 = 'done'; step2 = 'active'; }
                    if (statut === 'en_livraison' || statut === 'livraison') { step1 = 'done'; step2 = 'done'; step3 = 'active'; }
                    if (statut === 'livre' || statut === 'livré') { step1 = 'done'; step2 = 'done'; step3 = 'done'; step4 = 'done'; }

                    return `
                    <div class="commande-card">
                        <div class="commande-header">
                            <h3>Commande #${cmd.id}</h3>
                            <span class="prix">${parseFloat(cmd.total).toFixed(2)} €</span>
                        </div>
                        <div style="font-size: 0.8rem; color: #aaa; margin-bottom: 15px;">Passée le ${new Date(cmd.date_commande).toLocaleString('fr-FR')}</div>
                        
                        <div class="timeline">
                            <div class="step ${step1}"><div class="step-dot"></div><div class="step-label">Reçue</div></div>
                            <div class="step ${step2}"><div class="step-dot"></div><div class="step-label">Prépa</div></div>
                            <div class="step ${step3}"><div class="step-dot"></div><div class="step-label">Livraison</div></div>
                            <div class="step ${step4}"><div class="step-dot"></div><div class="step-label">Livré</div></div>
                        </div>
                    </div>`;
                }).join('');
            } catch (e) { document.getElementById('mesCommandes').innerHTML = "Erreur de chargement."; }
        }
        function logout() { localStorage.removeItem('puff_client'); window.location.href = '/'; }
        loadMesCommandes();
    </script>
</body>
</html>
