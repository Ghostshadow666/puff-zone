<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUFF ZONE - Panier</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .panier-container { max-width: 700px; margin: 40px auto; padding: 0 20px; position: relative; z-index: 10; }
        .panier-card { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 25px; margin-bottom: 20px; box-shadow: 0 0 20px rgba(0, 243, 255, 0.05); backdrop-filter: blur(10px); }
        .panier-card h2 { font-family: 'Orbitron', sans-serif; color: var(--neon-cyan); margin-top: 0; font-size: 1.2rem; }
        .item-panier { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .item-panier:last-child { border-bottom: none; }
        .item-nom { font-weight: 700; color: white; }
        .item-details { font-size: 0.8rem; color: #888; }
        .item-prix { font-weight: 900; color: var(--neon-cyan); }
        .total-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 10px; }
        .total-row.sep { border-top: 1px solid var(--border); padding-top: 15px; }
        .total-label { font-size: 1.1rem; font-weight: 700; color: white; }
        .total-amount { font-size: 1.6rem; font-weight: 900; color: var(--neon-cyan); }
        .discount-amount { color: #22C55E; font-weight: 900; }
        .promo-row { display: flex; gap: 10px; margin-top: 15px; }
        .promo-row input { flex: 1; padding: 12px; background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: white; border-radius: 8px; font-family: 'Rajdhani', sans-serif; font-size: 16px; outline: none; text-transform: uppercase; }
        .promo-row input:focus { border-color: var(--neon-cyan); }
        .promo-row button { padding: 12px 20px; background: transparent; color: var(--neon-cyan); border: 1px solid var(--neon-cyan); border-radius: 8px; font-weight: 900; cursor: pointer; transition: 0.3s; text-transform: uppercase; font-family: 'Rajdhani', sans-serif; }
        .promo-row button:hover { background: var(--neon-cyan); color: black; }
        .promo-message { margin-top: 10px; font-size: 0.9rem; font-weight: 700; }
        .promo-success { color: #22C55E; }
        .promo-error { color: #EF4444; }
        .btn-valider { width: 100%; padding: 16px; background: transparent; color: var(--neon-cyan); border: 2px solid var(--neon-cyan); border-radius: 10px; font-weight: 900; font-size: 16px; cursor: pointer; transition: 0.3s; text-transform: uppercase; font-family: 'Rajdhani', sans-serif; letter-spacing: 1px; margin-top: 20px; }
        .btn-valider:hover:not(:disabled) { background: var(--neon-cyan); color: black; box-shadow: 0 0 20px var(--neon-cyan); }
        .btn-valider:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-retour { display: inline-block; margin-bottom: 20px; color: var(--neon-cyan); text-decoration: none; font-weight: 700; border: 1px solid var(--border); padding: 8px 16px; border-radius: 8px; transition: 0.3s; }
        .btn-retour:hover { background: rgba(0, 243, 255, 0.1); }
        .empty-cart { text-align: center; color: #888; font-style: italic; padding: 30px 0; }
    </style>
</head>
<body>
    <div class="nebula-bg"></div>
    <div class="overlay-dark"></div>
    <div class="stars"></div>

    <div class="panier-container">
        <a href="/" class="btn-retour">← Retour Boutique</a>

        <div class="panier-card">
            <h2>🛒 Mon Panier</h2>
            <div id="panierListe">
                <div class="empty-cart">Chargement...</div>
            </div>

            <div class="total-row">
                <span>Sous-total</span>
                <span id="sousTotal">0.00 €</span>
            </div>

            <div class="total-row" id="discountRow" style="display:none;">
                <span>Réduction (<span id="pctLabel">0</span>%)</span>
                <span class="discount-amount" id="montantReduction">-0.00 €</span>
            </div>

            <div class="total-row sep">
                <span class="total-label">Total</span>
                <span class="total-amount" id="totalAffichage">0.00 €</span>
            </div>

            <div class="promo-row">
                <input type="text" id="promoInput" placeholder="Code promo (ex: PUFF10)">
                <button onclick="appliquerPromo()">Appliquer</button>
            </div>
            <div id="promoMessage" class="promo-message"></div>

            <button class="btn-valider" id="btnValider" onclick="validerCommande()">Valider la commande</button>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        let panier = JSON.parse(localStorage.getItem('puff_cart')) || [];
        let client = JSON.parse(localStorage.getItem('puff_client'));
        let reductionPourcentage = 0;
        let sousTotal = 0;
        let stocksDisponibles = {};

        // 1. Charger le catalogue pour connaître les stocks actuels
        async function chargerStocks() {
            try {
                const res = await fetch(`${API_URL}/catalogue`);
                const data = await res.json();
                data.saveurs.forEach(s => { stocksDisponibles[s.nom] = s.stock; });
            } catch (e) {
                console.error("Impossible de charger les stocks", e);
            }
        }

        // 2. Vérifier et bloquer les quantités au stock disponible
        function verifierStocksPanier() {
            const modifications = [];
            const nouveauPanier = [];

            for (const item of panier) {
                const dispo = stocksDisponibles[item.nom];
                if (dispo === undefined) {
                    modifications.push(`"${item.nom}" introuvable (retiré).`);
                    continue;
                }
                if (dispo === 0) {
                    modifications.push(`"${item.nom}" en rupture de stock (retiré).`);
                    continue;
                }
                if (item.qty > dispo) {
                    modifications.push(`"${item.nom}" : quantité réduite à ${dispo} (max dispo).`);
                    item.qty = dispo;
                }
                nouveauPanier.push(item);
            }

            panier = nouveauPanier;
            localStorage.setItem('puff_cart', JSON.stringify(panier));
            return modifications;
        }

        // 3. Affichage du panier
        function afficherPanier() {
            const container = document.getElementById('panierListe');
            const btnValider = document.getElementById('btnValider');

            if (panier.length === 0) {
                container.innerHTML = '<div class="empty-cart">Votre panier est vide.</div>';
                document.getElementById('sousTotal').textContent = '0.00 €';
                document.getElementById('totalAffichage').textContent = '0.00 €';
                document.getElementById('discountRow').style.display = 'none';
                btnValider.disabled = true;
                return;
            }
            btnValider.disabled = false;

            sousTotal = panier.reduce((sum, item) => sum + (item.prix * item.qty), 0);
            let totalAffiche = sousTotal;

            if (reductionPourcentage > 0) {
                const reduction = sousTotal * (reductionPourcentage / 100);
                totalAffiche = sousTotal - reduction;
                document.getElementById('discountRow').style.display = 'flex';
                document.getElementById('pctLabel').textContent = reductionPourcentage;
                document.getElementById('montantReduction').textContent = '-' + reduction.toFixed(2) + ' €';
            } else {
                document.getElementById('discountRow').style.display = 'none';
            }

            container.innerHTML = panier.map(item => `
                <div class="item-panier">
                    <div>
                        <div class="item-nom">${item.nom}</div>
                        <div class="item-details">Quantité : ${item.qty}</div>
                    </div>
                    <div class="item-prix">${(item.prix * item.qty).toFixed(2)} €</div>
                </div>
            `).join('');

            document.getElementById('sousTotal').textContent = sousTotal.toFixed(2) + ' €';
            document.getElementById('totalAffichage').textContent = totalAffiche.toFixed(2) + ' €';
        }

        // 4. Application du code promo
        async function appliquerPromo() {
            const code = document.getElementById('promoInput').value.trim();
            const msg = document.getElementById('promoMessage');

            if (!code) {
                msg.textContent = 'Veuillez entrer un code promo.';
                msg.className = 'promo-message promo-error';
                return;
            }

            try {
                const res = await fetch(`${API_URL}/promo/check`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });
                const data = await res.json();

                if (data.success) {
                    reductionPourcentage = data.pourcentage;
                    msg.textContent = `✅ Code appliqué : -${data.pourcentage}%`;
                    msg.className = 'promo-message promo-success';
                    afficherPanier();
                } else {
                    reductionPourcentage = 0;
                    msg.textContent = '❌ ' + (data.error || 'Code invalide.');
                    msg.className = 'promo-message promo-error';
                    afficherPanier();
                }
            } catch (e) {
                msg.textContent = 'Erreur de connexion au serveur.';
                msg.className = 'promo-message promo-error';
            }
        }

        // 5. Validation finale
        async function validerCommande() {
            if (!client || !client.id) {
                alert("Veuillez vous connecter pour valider votre commande.");
                window.location.href = '/';
                return;
            }
            if (panier.length === 0) {
                alert("Votre panier est vide.");
                return;
            }

            const promoCode = document.getElementById('promoInput').value.trim().toUpperCase() || null;
            const totalFinal = parseFloat(document.getElementById('totalAffichage').textContent.replace(' €', ''));
            const btn = document.getElementById('btnValider');
            btn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/commandes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        client_id: client.id,
                        cart: panier,
                        total: totalFinal,
                        promo_code: promoCode
                    })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    localStorage.removeItem('puff_cart');
                    alert("✅ Commande validée ! Merci pour votre achat.");
                    window.location.href = '/compte.html';
                } else {
                    alert("Erreur : " + (data.error || "inconnue"));
                    // Recharger les stocks au cas où
                    await chargerStocks();
                    const modifs = verifierStocksPanier();
                    afficherPanier();
                    if (modifs.length > 0) {
                        const msg = document.getElementById('promoMessage');
                        msg.textContent = '⚠️ ' + modifs.join(' | ');
                        msg.className = 'promo-message promo-error';
                    }
                    btn.disabled = false;
                }
            } catch (e) {
                alert("Erreur de connexion au serveur.");
                btn.disabled = false;
            }
        }

        // Init
        (async () => {
            await chargerStocks();
            const modifs = verifierStocksPanier();
            afficherPanier();
            if (modifs.length > 0) {
                const msg = document.getElementById('promoMessage');
                msg.textContent = '⚠️ ' + modifs.join(' | ');
                msg.className = 'promo-message promo-error';
            }
        })();
    </script>
</body>
</html>
