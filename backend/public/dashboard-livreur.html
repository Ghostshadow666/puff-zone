<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUFF ZONE - Mes TournÃ©es</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .dashboard-container { max-width: 800px; margin: 30px auto; padding: 20px; position: relative; z-index: 10; }
        .dashboard-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; backdrop-filter: blur(15px); box-shadow: 0 0 30px rgba(0, 243, 255, 0.05); margin-bottom: 20px; }
        .dashboard-card h1 { font-family: 'Orbitron', sans-serif; color: var(--neon-cyan); margin-top: 0; }
        .order-item { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .btn-action { display: inline-block; padding: 8px 12px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 14px; margin-right: 5px; text-align: center; }
        .btn-wa { background: #25D366; color: black; }
        .btn-maps { background: #4285F4; color: white; }
        .btn-done { background: var(--violet); color: white; border: none; cursor: pointer; width: 100%; margin-top: 10px; padding: 10px; }
    </style>
</head>
<body>
    <div class="nebula-bg"></div>
    <div class="bg-watermark"></div>
    <div class="overlay-dark"></div>

    <header class="header">
        <div class="logo">PUFF <span>ZONE</span></div>
        <div class="header-actions">
            <a href="/" class="btn-header">Boutique</a>
            <button class="btn-panier" onclick="logoutLivreur()" style="border-color: #ff4444; color: #ff4444;">DÃ©connexion</button>
        </div>
    </header>

    <div class="dashboard-container">
        <div class="dashboard-card">
            <h1 id="welcome-msg">MES TOURNÃ‰ES</h1>
            <p style="color: #aaa; text-transform: uppercase;">Commandes Ã  livrer</p>
            <div id="ordersList" style="margin-top: 20px;">Chargement...</div>
        </div>
    </div>

    <script>
// --- INTERCEPTEUR POUR AJOUTER LE TOKEN ---
const originalFetch = window.fetch;
window.fetch = function() {
    let [resource, config] = arguments;
    const token = localStorage.getItem('token');
    if (token) {
        config = config || {};
        config.headers = config.headers || {};
        config.headers['Authorization'] = 'Bearer ' + token;
    }
    return originalFetch(resource, config).then(response => {
        if (response.status === 401) {
            localStorage.removeItem('token');
            localStorage.removeItem('puff_livreur');
            window.location.href = 'livreur.html';
        }
        return response;
    });
};

        const livreur = JSON.parse(localStorage.getItem('puff_livreur'));
        if (!livreur) { window.location.href = '/livreur.html'; } 
        else { document.getElementById('welcome-msg').textContent = `SALUT, ${livreur.name.toUpperCase()}`; }

        async function loadOrders() {
            try {
                const res = await fetch(`/api/commandes/livreur/${livreur.id}`);
                const orders = await res.json();
                const container = document.getElementById('ordersList');

                if (orders.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#aaa; font-style:italic;">Aucune tournÃ©e pour le moment.</p>';
                    return;
                }

                container.innerHTML = orders.map(o => {
                    const waNumber = (o.whatsapp || o.telephone).replace(/\D/g,'');
                    const mapLink = o.adresse ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.adresse)}` : '#';
                    
                    return `
                        <div class="order-item">
                            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                                <div style="font-weight:bold; color:var(--neon-cyan); font-size:1.1rem;">${o.client_nom}</div>
                                <div style="font-weight:bold; color:#22C55E;">${o.total}â‚¬</div>
                            </div>
                            <div style="font-size:0.9rem; color:#ccc; margin-bottom:5px;">ðŸ“ ${o.adresse || 'Adresse non renseignÃ©e'}</div>
                            <div style="font-size:0.9rem; color:#ccc; margin-bottom:15px;">ðŸ“ž ${o.telephone}</div>
                            
                            <div style="display:flex; gap:10px; margin-bottom:10px;">
                                ${waNumber ? `<a href="https://wa.me/${waNumber}" target="_blank" class="btn-action btn-wa" style="flex:1;">ðŸ’¬ WhatsApp</a>` : ''}
                                ${o.adresse ? `<a href="${mapLink}" target="_blank" class="btn-action btn-maps" style="flex:1;">ðŸ—ºï¸ ItinÃ©raire</a>` : ''}
                            </div>
                            
                            <button onclick="markAsDelivered(${o.id})" class="btn-action btn-done">âœ… Marquer comme LivrÃ©</button>
                        </div>
                    `;
                }).join('');
            } catch (e) { console.error(e); document.getElementById('ordersList').innerHTML = 'Erreur : ' + e.message; }
        }

        async function markAsDelivered(orderId) {
            if (!confirm('Confirmer que cette commande a Ã©tÃ© livrÃ©e ?')) return;
            await fetch(`/api/commandes/${orderId}/statut`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ statut: 'livre' })
            });
            loadOrders();
        }

        function logoutLivreur() {
            localStorage.removeItem('puff_livreur');
            window.location.href = '/livreur.html';
        }

        loadOrders();
    </script>
</body>
</html>
