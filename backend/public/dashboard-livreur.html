<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUFF ZONE - Livreur</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .dash-container { max-width: 800px; margin: 20px auto; padding: 0 20px; position: relative; z-index: 10; }
        .nav-livreur { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--card); padding: 15px 20px; border-radius: 10px; border: 1px solid var(--border); }
        .nav-livreur h1 { font-family: 'Orbitron', sans-serif; color: var(--neon-cyan); font-size: 1.2rem; margin: 0; }
        .btn-deco { background: rgba(239, 68, 68, 0.1); color: #EF4444; border: 1px solid #EF4444; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; background: var(--card); border: 1px solid var(--border); color: white; border-radius: 8px; cursor: pointer; font-weight: 700; font-family: 'Rajdhani', sans-serif; font-size: 1rem; transition: 0.3s; }
        .tab-btn.active { background: var(--neon-cyan); color: black; border-color: var(--neon-cyan); }
        .card-livreur { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 15px; }
        .commande-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-bottom: 10px; }
        .commande-title { font-weight: 900; font-size: 1.1rem; color: var(--neon-cyan); }
        .commande-info { font-size: 0.9rem; color: #ccc; margin-bottom: 5px; }
        .commande-info strong { color: white; }
        .btn-livrer { width: 100%; padding: 10px; background: #22C55E; color: black; border: none; border-radius: 5px; font-weight: 900; cursor: pointer; margin-top: 15px; text-transform: uppercase; }
        .zone-item { padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="nebula-bg"></div>
    <div class="overlay-dark"></div>
    <div class="stars"></div>

    <div class="dash-container">
        <div class="nav-livreur">
            <h1>🛵 Espace Livreur</h1>
            <button class="btn-deco" onclick="logout()">Déconnexion</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tab-commandes', this)">📦 Mes Livraisons</button>
            <button class="tab-btn" onclick="switchTab('tab-zones', this)">🗺️ Zones</button>
        </div>

        <!-- ONGLET COMMANDES -->
        <div id="tab-commandes" class="tab-content">
            <div id="commandesList">Chargement...</div>
        </div>

        <!-- ONGLET ZONES -->
        <div id="tab-zones" class="tab-content hidden">
            <div id="zonesList">Chargement...</div>
        </div>
    </div>

    <script>
        // --- INTERCEPTEUR POUR AJOUTER LE TOKEN ---
        const originalFetch = window.fetch;
        window.fetch = function() {
            let [resource, config] = arguments;
            const token = localStorage.getItem('token');
            if (token) {
                config = config || {};
                config.headers = config.headers || {};
                config.headers['Authorization'] = 'Bearer ' + token;
            }
            return originalFetch(resource, config).then(response => {
                if (response.status === 401 || response.status === 403) {
                    logout();
                }
                return response;
            });
        };

        const livreur = JSON.parse(localStorage.getItem('puff_livreur'));
        if (!livreur || livreur.role !== 'livreur') {
            window.location.href = '/livreur.html';
        }

        const API_URL = '/api';

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.remove('hidden');
            btn.classList.add('active');
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('puff_livreur');
            window.location.href = '/livreur.html';
        }

        // --- CHARGER LES COMMANDES ---
        async function loadCommandes() {
            try {
                const res = await fetch(`${API_URL}/commandes/livreur/${livreur.id}`);
                const commandes = await res.json();
                const container = document.getElementById('commandesList');

                if (commandes.length === 0) {
                    container.innerHTML = '<div class="card-livreur" style="text-align:center;">Aucune commande à livrer pour le moment. 🎉</div>';
                    return;
                }

                container.innerHTML = commandes.map(cmd => {
                    // On récupère les coordonnées si l'adresse est fournie pour Google Maps
                    const adresseEncodee = encodeURIComponent(cmd.adresse || '');
                    const mapLink = cmd.adresse ? `https://www.google.com/maps/search/?api=1&query=${adresseEncodee}` : '#';
                    
                    return `
                    <div class="card-livreur">
                        <div class="commande-header">
                            <span class="commande-title">Commande #${cmd.id}</span>
                            <span style="color: #22C55E; font-weight: bold;">${parseFloat(cmd.total).toFixed(2)} €</span>
                        </div>
                        <div class="commande-info">👤 Client : <strong>${cmd.client_nom}</strong></div>
                        <div class="commande-info">📞 Téléphone : <strong>${cmd.telephone}</strong></div>
                        <div class="commande-info">📍 Adresse : <strong>${cmd.adresse || 'Non renseignée'}</strong></div>
                        
                        <div style="display: flex; gap: 10px; margin-top: 15px;">
                            ${cmd.whatsapp ? `<a href="https://wa.me/${cmd.whatsapp.replace(/\D/g,'')}" target="_blank" style="flex:1; padding:10px; background:#25D366; color:white; text-align:center; text-decoration:none; border-radius:5px; font-weight:bold;">WhatsApp</a>` : ''}
                            ${cmd.adresse ? `<a href="${mapLink}" target="_blank" style="flex:1; padding:10px; background:#3B82F6; color:white; text-align:center; text-decoration:none; border-radius:5px; font-weight:bold;">Maps</a>` : ''}
                        </div>

                        <button class="btn-livrer" onclick="marquerLivre(${cmd.id})">Marquer comme livrée ✅</button>
                    </div>
                    `;
                }).join('');
            } catch (e) {
                document.getElementById('commandesList').innerHTML = 'Erreur de chargement.';
            }
        }

        async function marquerLivre(id) {
            if (!confirm("Confirmer la livraison de cette commande ?")) return;
            try {
                await fetch(`${API_URL}/commandes/${id}/statut`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ statut: 'livre' })
                });
                loadCommandes(); // On recharge la liste
            } catch (e) { alert("Erreur lors de la mise à jour."); }
        }

        // --- CHARGER LES ZONES ---
        async function loadZones() {
            try {
                const res = await fetch(`${API_URL}/zones`);
                const zones = await res.json();
                const container = document.getElementById('zonesList');

                if (zones.length === 0) {
                    container.innerHTML = '<div class="card-livreur" style="text-align:center;">Aucune zone enregistrée.</div>';
                    return;
                }

                container.innerHTML = zones.map(z => `
                    <div class="zone-item">
                        <strong style="color: var(--neon-cyan);">${z.nom}</strong>
                        <div style="font-size: 0.85rem; color: #aaa; margin-top: 5px;">
                            Minimum : ${z.min_commande} € | Rayon : ${z.rayon / 1000} km
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('zonesList').innerHTML = 'Erreur de chargement.';
            }
        }

        // Initialisation
        loadCommandes();
        loadZones();
    </script>
</body>
</html>
