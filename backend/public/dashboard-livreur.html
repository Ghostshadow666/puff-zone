<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUFF ZONE - Livreur</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .dash-container { max-width: 900px; margin: 30px auto; padding: 0 20px; position: relative; z-index: 10; }
        .nav-livreur { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: var(--card-bg); backdrop-filter: blur(20px); padding: 20px 25px; border-radius: 15px; border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(0,0,0,0.5);}
        .nav-livreur h1 { font-family: 'Orbitron', sans-serif; color: var(--neon-cyan); font-size: 1.3rem; margin: 0; letter-spacing:1px;}
        .btn-deco { background: rgba(239, 68, 68, 0.1); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.3); padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; transition:0.3s;}
        .btn-deco:hover { background: rgba(239,68,68,0.2); }
        .tabs { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .tab-btn { flex: 1; padding: 15px; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text2); border-radius: 10px; cursor: pointer; font-weight: 600; font-family: 'Outfit', sans-serif; font-size: 1rem; transition: 0.3s; min-width: 120px; backdrop-filter: blur(10px);}
        .tab-btn.active { background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan)); color: white; border-color: transparent; box-shadow: 0 0 15px rgba(168,85,247,0.4);}
        .card-livreur { background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--card-border); border-radius: 15px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);}
        .commande-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; margin-bottom: 15px; }
        .commande-title { font-weight: 800; font-size: 1.2rem; color: var(--neon-cyan); }
        .commande-info { font-size: 0.95rem; color: var(--text2); margin-bottom: 10px; display:flex; align-items:center; gap:8px;}
        .commande-info strong { color: var(--text); }
        .btn-livrer { width: 100%; padding: 15px; background: linear-gradient(135deg, #10B981, #059669); color: white; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; margin-top: 20px; text-transform: uppercase; letter-spacing:1px; transition:0.3s;}
        .btn-livrer:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);}
        .zone-item { padding: 15px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 10px; margin-bottom: 10px; }
        .hidden { display: none; }
        #map { height: 400px; border-radius: 15px; z-index: 1; margin-bottom: 20px; border: 1px solid var(--card-border);}
        .leaflet-layer, .leaflet-control-zoom-in, .leaflet-control-zoom-out, .leaflet-control-attribution { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
        .stats-box { display: flex; gap: 20px; margin-bottom: 25px; }
        .stat-card { flex: 1; background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--card-border); border-radius: 15px; padding: 25px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);}
        .stat-val { font-size: 2rem; font-weight: 900; color: var(--neon-cyan); text-shadow:0 0 15px rgba(34,211,238,0.3);}
        .stat-label { font-size: 0.85rem; color: var(--text2); text-transform: uppercase; font-weight:600; letter-spacing:1px; margin-top:10px;}
        
        @media (max-width: 768px) {
            .nav-livreur { flex-direction: column; gap: 15px; text-align: center; }
            .stats-box { flex-direction: column; }
            .tab-btn { min-width: 100%; }
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none;"></canvas>

    <div class="dash-container">
        <div class="nav-livreur">
            <h1>&#128757; Espace Livreur</h1>
            <button class="btn-deco" onclick="logout()">D&eacute;connexion</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tab-commandes', this)">&#128230; En cours</button>
            <button class="tab-btn" onclick="switchTab('tab-historique', this)">&#9989; Historique</button>
            <button class="tab-btn" onclick="switchTab('tab-stats', this)">&#128202; Mes Stats</button>
            <button class="tab-btn" onclick="switchTab('tab-zones', this)">&#128506;&#65039; Zones</button>
        </div>

        <div id="tab-commandes" class="tab-content">
            <div id="commandesList">Chargement...</div>
        </div>

        <div id="tab-historique" class="tab-content hidden">
            <div id="historiqueList">Chargement...</div>
        </div>

        <div id="tab-stats" class="tab-content hidden">
            <div class="stats-box">
                <div class="stat-card">
                    <div class="stat-val" id="statLivraisons">0</div>
                    <div class="stat-label">Livraisons termin&eacute;es</div>
                </div>
                <div class="stat-card">
                    <div class="stat-val" id="statCA">0 &euro;</div>
                    <div class="stat-label">Chiffre d'Affaires g&eacute;n&eacute;r&eacute;</div>
                </div>
            </div>
        </div>

        <div id="tab-zones" class="tab-content hidden">
            <div id="map"></div>
            <div id="zonesList"></div>
        </div>
    </div>

    <script src="bg-animation.js"></script>
    <script>
        // Intercepteur sécurisé : ne déconnecte que si le token est invalide (401)
        const originalFetch = window.fetch;
        window.fetch = function() {
            let [resource, config] = arguments;
            const token = localStorage.getItem('token');
            if (token) { config = config || {}; config.headers = config.headers || {}; config.headers['Authorization'] = 'Bearer ' + token; }
            return originalFetch(resource, config).then(response => { 
                if (response.status === 401) logout(); 
                return response; 
            });
        };
        
        const livreur = JSON.parse(localStorage.getItem('puff_livreur'));
        if (!livreur || livreur.role !== 'livreur') { window.location.href = '/livreur.html'; }
        const API_URL = '/api';

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.remove('hidden');
            btn.classList.add('active');
            if(tabId === 'tab-zones' && map) setTimeout(() => map.invalidateSize(), 150);
        }
        
        function logout() { 
            localStorage.removeItem('token'); 
            localStorage.removeItem('puff_livreur'); 
            window.location.href = '/livreur.html'; 
        }

        async function loadCommandes() {
            try {
                const res = await fetch(`${API_URL}/commandes/livreur/${livreur.id}`);
                const commandes = await res.json();
                const container = document.getElementById('commandesList');
                
                if (commandes.length === 0) { 
                    container.innerHTML = '<div class="card-livreur" style="text-align:center; color:var(--text2);">Aucune commande en cours. &#127881;</div>'; 
                    return; 
                }
                
                container.innerHTML = commandes.map(cmd => {
                    const tel = cmd.telephone || cmd.whatsapp || '';
                    const numTel = tel.replace(/\D/g,'');
                    const adresseEncodee = encodeURIComponent(cmd.adresse || '');
                    return `
                    <div class="card-livreur">
                        <div class="commande-header">
                            <span class="commande-title">Commande #${cmd.id}</span>
                            <span style="color: var(--neon-cyan); font-weight: 800; font-size:1.2rem;">${parseFloat(cmd.total).toFixed(2)} &euro;</span>
                        </div>
                        <div class="commande-info">&#128100; Client : <strong>${cmd.client_nom}</strong></div>
                        <div class="commande-info">&#128222; T&eacute;l&eacute;phone : <strong>${tel}</strong></div>
                        <div class="commande-info">&#128205; Adresse : <strong>${cmd.adresse || 'Non renseign&eacute;e'}</strong></div>
                        <div style="display: flex; gap: 15px; margin-top: 20px;">
                            ${numTel ? `<a href="https://wa.me/${numTel}" target="_blank" style="flex:1; padding:12px; background:#25D366; color:white; text-align:center; text-decoration:none; border-radius:10px; font-weight:bold;">WhatsApp</a>` : ''}
                            ${cmd.adresse ? `<a href="https://www.google.com/maps/search/?api=1&query=${adresseEncodee}" target="_blank" style="flex:1; padding:12px; background:#3B82F6; color:white; text-align:center; text-decoration:none; border-radius:10px; font-weight:bold;">Maps</a>` : ''}
                        </div>
                        <button class="btn-livrer" onclick="marquerLivre(${cmd.id})">Marquer comme livr&eacute;e &#9989;</button>
                    </div>`;
                }).join('');
            } catch (e) { document.getElementById('commandesList').innerHTML = 'Erreur de chargement.'; }
        }

        async function marquerLivre(id) {
            if (!confirm("Confirmer la livraison ?")) return;
            try {
                const res = await fetch(`${API_URL}/commandes/${id}/statut`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ statut: 'livre' }) });
                if (res.ok) {
                    loadCommandes(); 
                    loadStats(); 
                    loadHistorique();
                } else {
                    const data = await res.json();
                    alert("Erreur : " + data.error);
                }
            } catch (e) { alert("Erreur de connexion."); }
        }

        async function loadHistorique() {
            try {
                const res = await fetch(`${API_URL}/commandes/livreur/${livreur.id}/historique`);
                const hist = await res.json();
                const container = document.getElementById('historiqueList');
                if (hist.length === 0) { container.innerHTML = '<div class="card-livreur" style="text-align:center; color:var(--text2);">Aucune livraison termin&eacute;e.</div>'; return; }
                container.innerHTML = hist.map(cmd => `<div class="card-livreur" style="opacity: 0.8;"><div class="commande-header"><span class="commande-title">Commande #${cmd.id}</span><span style="color: var(--green); font-weight:800;">${parseFloat(cmd.total).toFixed(2)} &euro;</span></div><div class="commande-info">&#128100; ${cmd.client_nom}</div><div class="commande-info" style="font-size: 0.85rem;">Livr&eacute; le ${new Date(cmd.date_commande).toLocaleString('fr-FR')}</div></div>`).join('');
            } catch (e) {}
        }

        async function loadStats() {
            try {
                const res = await fetch(`${API_URL}/livreur/${livreur.id}/stats`);
                const stats = await res.json();
                document.getElementById('statLivraisons').textContent = stats.total_livraisons;
                document.getElementById('statCA').textContent = parseFloat(stats.total_ca).toFixed(2) + ' &euro;';
            } catch (e) {}
        }

        let map = null;
        async function loadZones() {
            try {
                map = L.map('map').setView([50.633, 5.567], 9);
                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
                const res = await fetch(`${API_URL}/zones`);
                const zones = await res.json();
                const container = document.getElementById('zonesList');
                if (zones.length === 0) { container.innerHTML = '<div class="card-livreur" style="text-align:center;">Aucune zone.</div>'; return; }
                container.innerHTML = zones.map(z => `<div class="zone-item"><strong style="color: var(--neon-cyan);">${z.nom}</strong> (Rayon: ${z.rayon/1000}km)</div>`).join('');
                zones.forEach(z => { L.circle([z.lat, z.lng], { radius: z.rayon, color: '#22D3EE', fillColor: '#22D3EE', fillOpacity: 0.2 }).addTo(map).bindPopup(`<b>${z.nom}</b><br>Min: ${z.min_commande}&euro;`); });
            } catch (e) {}
        }

        loadCommandes(); loadHistorique(); loadStats(); setTimeout(loadZones, 500);
    </script>
</body>
</html>
