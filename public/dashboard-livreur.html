<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUFF ZONE - Dashboard Livreur</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .dashboard-container { max-width: 800px; margin: 50px auto; padding: 20px; position: relative; z-index: 10; }
        .dashboard-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 30px; backdrop-filter: blur(15px); box-shadow: 0 0 30px rgba(0, 243, 255, 0.05); text-align: center; }
        .dashboard-card h1 { font-family: 'Orbitron', sans-serif; color: var(--neon-cyan); margin-top: 0; }
        .stat-box { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 20px; margin: 20px 0; text-align: center; }
        .stat-box h3 { color: #888; margin: 0 0 10px 0; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;}
        .stat-box .value { font-size: 2rem; font-family: 'Orbitron', sans-serif; color: var(--neon-magenta); font-weight: 900; }
        .btn-logout { background: transparent; border: 1px solid #ff4444; color: #ff4444; padding: 10px 20px; border-radius: 5px; cursor: pointer; text-transform: uppercase; font-weight: bold; transition: 0.3s; margin-top: 20px;}
        .btn-logout:hover { background: #ff4444; color: white; box-shadow: 0 0 15px #ff4444; }
    </style>
</head>
<body>
    <div class="nebula-bg"></div>
    <div class="overlay-dark"></div>
    <div class="stars"></div>

    <header class="header">
        <div class="logo">PUFF <span>ZONE</span></div>
        <div class="header-actions">
            <a href="/" class="btn-header">Retour Boutique</a>
        </div>
    </header>

    <div class="dashboard-container">
        <div class="dashboard-card">
            <h1 id="welcome-msg">BIENVENUE</h1>
            <p style="color: #aaa; text-transform: uppercase;">Statut : En ligne 🟢</p>

            <div class="stat-box">
                <h3>Tournées du jour</h3>
                <div class="value" id="deliveries-count">0</div>
            </div>

            <p style="color: #888; font-style: italic;">L'interface des commandes et des tournées sera ajoutée à la prochaine étape.</p>
            
            <button class="btn-logout" onclick="logoutLivreur()">Se déconnecter</button>
        </div>
    </div>

    <script>
        const livreur = JSON.parse(localStorage.getItem('puff_livreur'));

        if (!livreur) {
            window.location.href = '/livreur.html';
        } else {
            document.getElementById('welcome-msg').textContent = `SALUT, ${livreur.name.toUpperCase()}`;
        }

        function logoutLivreur() {
            localStorage.removeItem('puff_livreur');
            window.location.href = '/livreur.html';
        }
    </script>
</body>
</html>
