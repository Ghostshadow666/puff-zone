<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUFF ZONE — Zones de Livraison</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root { --bg: #05050f; --card: rgba(15, 15, 32, 0.75); --purple: #A855F7; --cyan: #22D3EE; --text: #F1F5F9; --text2: #94A3B8; --border: rgba(168, 85, 247, 0.3); --red: #EF4444; }
  body { background: radial-gradient(ellipse at 15% 0%, rgba(168, 85, 247, 0.15), transparent 55%), radial-gradient(ellipse at 85% 100%, rgba(34, 211, 238, 0.1), transparent 55%), var(--bg); color: var(--text); font-family: 'Nunito', sans-serif; margin: 0; padding: 40px 20px; min-height: 100vh; }
  .container { max-width: 900px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 30px; }
  .header h1 { background: linear-gradient(135deg, #C084FC 0%, #22D3EE 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 2rem; margin: 0; }
  .card { background: var(--card); backdrop-filter: blur(14px); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 24px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); }
  .card h2 { margin-top: 0; font-size: 1.2rem; color: var(--text); }
  #map { height: 400px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; z-index: 1; }
  .form-row { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; align-items: flex-end; }
  .input-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 150px; }
  .input-group label { font-size: 0.8rem; color: var(--text2); font-weight: 700; }
  input[type="text"], input[type="number"] { background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: white; padding: 10px 14px; border-radius: 10px; font-family: 'Nunito', sans-serif; font-size: 0.9rem; outline: none; }
  input:focus { border-color: var(--cyan); }
  .btn { background: linear-gradient(135deg, var(--purple), var(--cyan)); color: white; border: none; padding: 11px 20px; border-radius: 10px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.9rem; cursor: pointer; transition: transform 0.2s; }
  .btn:hover { transform: translateY(-2px); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.3); padding: 6px 12px; font-size: 0.8rem; }
  .btn-danger:hover { background: rgba(239, 68, 68, 0.25); }
  .zone-card { display: flex; align-items: center; justify-content: space-between; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 10px; }
  .zone-info { display: flex; flex-direction: column; gap: 4px; }
  .zone-name { font-weight: 900; font-size: 1.1rem; }
  .zone-details { font-size: 0.8rem; color: var(--text2); }
  /* Filtre pour rendre la carte OpenStreetMap sombre */
  .leaflet-layer,
  .leaflet-control-zoom-in,
  .leaflet-control-zoom-out,
  .leaflet-control-attribution {
    filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
  }
</style>
</head>
<body>
<div class="container">
  <div class="header"><h1>🗺️ PUFF ZONE — Zones de Livraison</h1></div>
  <div class="card">
    <h2>📍 Clique sur la carte pour placer une zone</h2>
    <div id="map"></div>
    <form id="addZoneForm">
      <div class="form-row">
        <div class="input-group"><label>Nom de la zone</label><input type="text" id="zoneName" placeholder="ex: Liège Centre" required></div>
        <div class="input-group"><label>Minimum de commande (€)</label><input type="number" id="zoneMin" value="50" required></div>
        <div class="input-group"><label>Rayon (km)</label><input type="number" id="zoneRayon" value="20" min="1" required></div>
        <button type="submit" class="btn" id="submitBtn" disabled>➕ Ajouter la zone</button>
      </div>
      <div style="font-size: 0.8rem; color: var(--text2); margin-top: -5px;">Cliquez d'abord sur la carte pour définir le centre.</div>
    </form>
  </div>
  <div class="card">
    <h2>📋 Zones enregistrées</h2>
    <div id="zoneList" style="text-align:center; color:var(--text2); font-style:italic;">Chargement...</div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const API_URL = '/api/zones';
  let currentMarker = null; let currentCircle = null; let selectedCoords = null;
  function initMap() {
    const map = L.map('map').setView([50.633, 5.567], 9);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OSM &copy; CARTO', subdomains: 'abcd', maxZoom: 19 }).addTo(map);
    map.on('click', function(e) {
      selectedCoords = { lat: e.latlng.lat, lng: e.latlng.lng };
      if (currentMarker) map.removeLayer(currentMarker); if (currentCircle) map.removeLayer(currentCircle);
      currentMarker = L.marker([selectedCoords.lat, selectedCoords.lng]).addTo(map);
      const rayon = document.getElementById('zoneRayon').value || 20;
      currentCircle = L.circle([selectedCoords.lat, selectedCoords.lng], { radius: rayon * 1000, color: '#A855F7', fillColor: '#A855F7', fillOpacity: 0.2 }).addTo(map);
      document.getElementById('submitBtn').disabled = false;
    });
  }
  document.getElementById('zoneRayon').addEventListener('input', function() { if (currentCircle && selectedCoords) currentCircle.setRadius(this.value * 1000); });
  async function loadZones() {
    try {
      const res = await fetch(API_URL); const zones = await res.json(); const listEl = document.getElementById('zoneList');
      if (zones.length === 0) { listEl.innerHTML = 'Aucune zone enregistrée.'; return; }
      listEl.innerHTML = zones.map(z => `
        <div class="zone-card">
          <div class="zone-info"><span class="zone-name">📍 ${z.nom}</span><span class="zone-details">Rayon : ${(z.rayon / 1000).toFixed(1)} km · Minimum : ${z.min_commande} €</span></div>
          <button class="btn btn-danger" onclick="deleteZone(${z.id})">🗑️ Supprimer</button>
        </div>`).join('');
    } catch (err) { document.getElementById('zoneList').innerHTML = '<span style="color:#EF4444;">Erreur de chargement.</span>'; }
  }
  document.getElementById('addZoneForm').addEventListener('submit', async (e) => {
    e.preventDefault(); if (!selectedCoords) return alert("Clique sur la carte !");
    const btn = document.getElementById('submitBtn'); btn.textContent = '⏳...'; btn.disabled = true;
    const nom = document.getElementById('zoneName').value; const min_commande = parseInt(document.getElementById('zoneMin').value); const rayon = parseInt(document.getElementById('zoneRayon').value) * 1000;
    try {
      await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nom, lat: selectedCoords.lat, lng: selectedCoords.lng, rayon, min_commande }) });
      document.getElementById('addZoneForm').reset(); btn.textContent = '➕ Ajouter la zone'; btn.disabled = true;
      if (currentMarker) map.removeLayer(currentMarker); if (currentCircle) map.removeLayer(currentCircle); selectedCoords = null;
      loadZones();
    } catch (err) { alert('Erreur : ' + err.message); btn.textContent = '➕ Ajouter la zone'; btn.disabled = false; }
  });
  async function deleteZone(id) {
    if (!confirm('Supprimer cette zone ?')) return;
    try { await fetch(`${API_URL}/${id}`, { method: 'DELETE' }); loadZones(); } catch (err) { alert('Erreur'); }
  }
  initMap(); loadZones();
</script>
</body>
</html>
